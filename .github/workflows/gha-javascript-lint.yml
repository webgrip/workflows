name: '[Call] Run Linting'

on:
  workflow_call:

jobs:
  eslint:
    name: 'ESLint'
    runs-on: arc-runner-set
    container: node:22.23.4@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint