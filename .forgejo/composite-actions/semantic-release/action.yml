name: "[Action] Semantic Release"
description: >-
  Cut a repository's release with semantic-release. Expects to run in the toolchain image
  (harbor.webgrip.dev/webgrip/semantic-release:0.1.2 — see docs/adrs/0005-semantic-release-toolchain-image.md),
  which bakes in node, git, yq, semantic-release 25 and @webgrip/semantic-release-config, so this
  action installs nothing and this file is only about RELEASE semantics. Output contract: the
  resolved config must include an @semantic-release/exec successCmd that writes
  `version=${nextRelease.version}` (and optionally `tag=${nextRelease.gitTag}`) to $GITHUB_OUTPUT.

inputs:
  release-type:
    description: "The type of release"
    required: false
  token:
    description: "Forgejo token to use for checkout/push and releases"
    required: false
  forge-url:
    description: "Public Forgejo base URL used for user-facing changelog/release links (not for API traffic)"
    required: false
    default: "https://forgejo.webgrip.dev"
  git-user-name:
    description: "Account name matching the token, used for push auth against the public host and for release commit-backs"
    required: false
    default: "webgrip-ci"
  git-user-email:
    description: "Git email for release commit-backs (@semantic-release/git)"
    required: false
    default: "ci@webgrip.nl"
  dry-run:
    description: "Run semantic-release with --dry-run (no tags, releases, or commits; also skips the baseline seed)"
    required: false
    default: "false"
  align-to-remote-tip:
    description: >-
      Before releasing a branch push, move the checkout onto the remote branch tip. A push landing
      after this run was queued leaves the detached checkout BEHIND origin, and semantic-release
      then aborts with "The local branch is behind the remote one" and cuts nothing — a silent
      no-op, and one nothing else recovers from when the commit that overtook it is a `[skip ci]`
      release commit. This closes the wide window (queued-then-overtaken); the run step catches
      what is left, since a push can still land in the seconds between this step and that one.
    required: false
    default: "true"
  install-dependencies:
    description: >-
      Install the CONSUMER's dependencies from its npm lockfile (package-lock.json or
      npm-shrinkwrap.json) and then run its build script, for repos whose config or prepareCmd
      needs them (e.g. @semantic-release/wordpress). The build runs only after a successful
      install. "auto" (default) never fails the release: a missing or unsupported lockfile, a
      failed install and a failed build are each logged and skipped. "true" makes every one of
      those fatal. "false" skips the step.
    required: false
    default: "auto"

outputs:
  version:
    description: "Bare semver of the release (empty if none)"
    value: ${{ steps.semantic-release.outputs.version }}
  tag:
    description: "Full git tag of the release, e.g. v1.0.14 (empty if none; needed as the checkout ref for tag-pinned follow-up jobs like helm-chart-push)"
    value: ${{ steps.semantic-release.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Check out repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # semantic-release requires all commits/tags
        token: ${{ inputs.token || github.token }}

    - name: Align to remote branch tip
      if: inputs.align-to-remote-tip == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
      shell: bash
      run: |
        set -euo pipefail
        git fetch --tags origin "${GITHUB_REF_NAME}"
        git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

    - name: Install consumer dependencies
      if: inputs.install-dependencies != 'false'
      shell: bash
      env:
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
      run: |
        set +e -u
        strict=false
        [[ "$INSTALL_DEPENDENCIES" == "true" ]] && strict=true

        give_up() {
          if [[ "$strict" == true ]]; then
            echo "::error::$2 install-dependencies is true, so the release stops here."
            exit 1
          fi
          echo "$1$2 install-dependencies is auto, so the release goes on."
          exit 0
        }
        skip() { give_up "" "$1"; }
        fail() { give_up "::warning::" "$1"; }

        [[ -f package.json ]] || { echo "No package.json; nothing to install or build."; exit 0; }

        if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
          for lockfile in pnpm-lock.yaml yarn.lock bun.lock bun.lockb; do
            [[ -f "$lockfile" ]] && skip "Unsupported lockfile ${lockfile}: only npm lockfiles are installed. Nothing installed, build not run."
          done
          skip "package.json has no lockfile. Nothing installed, build not run."
        fi

        echo "Installing consumer dependencies: npm ci"
        npm ci --no-audit --no-fund || fail "npm ci exited $?. Build not run, because its dependencies are not installed."

        if ! node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
          echo "No build script; nothing to build."
          exit 0
        fi
        echo "Building the consumer: npm run build"
        npm run build || fail "npm run build exited $?."
        exit 0

    # Start every repo from 0.0.0 (semantic-release otherwise hardcodes the first release to 1.0.0).
    # Idempotent: skipped once any v* tag exists. Needs the fetch-depth: 0 checkout above.
    - name: Seed baseline version tag (0.0.0)
      if: inputs.dry-run != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "$(git tag -l 'v[0-9]*')" ]; then
          echo "Release tags already exist (v*); skipping baseline seed."
          exit 0
        fi
        root="$(git rev-list --max-parents=0 HEAD | tail -1)"
        echo "No v* tag yet; seeding v0.0.0 at root commit ${root}."
        git tag "v0.0.0" "${root}"
        git push origin "v0.0.0"

    - name: Run semantic-release
      shell: bash
      id: semantic-release
      env:
        # Required by @webgrip/semantic-release-config at load time (Forgejo is the sole release
        # authority). Harmless for inline configs that don't read it.
        SEMANTIC_RELEASE_GITEA: "true"
        # Split addressing: the release API call stays in-cluster (github.server_url =
        # http://forgejo-http.forgejo.svc.cluster.local:3000 on the runner) so it never hairpins
        # out through the ingress, while the user-facing changelog/release links use the public
        # host (forge-url) via --repository-url below.
        GITEA_URL: ${{ github.server_url }}
        GITEA_TOKEN: ${{ inputs.token || github.token }}
        # GIT_CREDENTIALS is what semantic-release core reads to build an authenticated push URL
        # for --repository-url. Components must be URL-encoded if they contain reserved characters.
        GIT_CREDENTIALS: ${{ inputs.git-user-name }}:${{ inputs.token || github.token }}
        GIT_AUTHOR_NAME: ${{ inputs.git-user-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-user-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-user-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail
        forge_url="${{ inputs.forge-url }}"

        # semantic-release runs raw git commands (ls-remote during branch expansion, fetch, push)
        # against --repository-url — the PUBLIC host. The checkout only persists an auth header for
        # the in-cluster host, so on a PRIVATE repo the anonymous ls-remote 401s before
        # GIT_CREDENTIALS ever applies. Grant git the same style of credential checkout uses,
        # scoped to this checkout, and remove it on exit.
        auth_b64="$(printf '%s:%s' "x-access-token" "${GITEA_TOKEN}" | base64 -w0)"
        git config "http.${forge_url}/.extraheader" "AUTHORIZATION: basic ${auth_b64}"
        trap 'git config --unset-all "http.'"${forge_url}"'/.extraheader" || true' EXIT

        # The toolchain IS the image (ADR 0005): every dep prebaked flat from a committed lockfile,
        # the shared config's npm overrides applied at the install root. This action installs
        # NOTHING at runtime — an install here cannot apply a dependency's overrides (npm honors
        # them only at the install root), which nests plugin versions semantic-release's loader
        # prefers over the pinned pair; that is exactly how releases from 2026-07-31 to 2026-08-27
        # shipped heading-only notes without one red job. No usable toolchain → no release.
        # Probe rather than test for the file: pre-ADR-0005 ci-runners also export SEMREL_PREBAKED,
        # at an sr24 tree with no shared config, which would pass an -x check and die at config load.
        sr="${SEMREL_PREBAKED:-/nonexistent}/.bin/semantic-release"
        if [[ ! -x "$sr" ]] || ! NODE_PATH="${SEMREL_PREBAKED:-}" node -e '
              const v = require("semantic-release/package.json").version;
              if (v.split(".")[0] !== "25") throw new Error("semantic-release " + v);
              require.resolve("@webgrip/semantic-release-config");
              require.resolve("semantic-release-helm3");
            '; then
          echo "::error::No usable prebaked release toolchain (SEMREL_PREBAKED='${SEMREL_PREBAKED:-}')."
          echo "::error::Run this job in the toolchain image — add to the release job:"
          echo "::error::  container:"
          echo "::error::    image: harbor.webgrip.dev/webgrip/semantic-release:0.1.2"
          echo "::error::or use a ci-runner that bakes the ADR-0005 toolchain."
          exit 1
        fi

        # A repo's config is either its own file or, with none, semantic-release's defaults.
        # --extends layers a release-type variant on top; --config selects the file outright.
        args=(--repository-url "${forge_url}/${{ github.repository }}.git")
        [[ "${{ inputs.dry-run }}" == "true" ]] && args+=(--dry-run)
        rt="${{ inputs.release-type }}"
        if [[ -n "$rt" ]]; then
          for f in ".releaserc.${rt}.js" ".releaserc.${rt}.json"; do
            [[ -f "$f" ]] && { args+=("--extends=./${f}"); break; }
          done
        else
          for f in .releaserc.cjs .releaserc.js .releaserc.json; do
            [[ -f "$f" ]] && { args+=("--config=./${f}"); break; }
          done
        fi

        # A push landing between "Align to remote branch tip" and this command leaves the checkout
        # behind origin, and semantic-release then aborts with "The local branch is behind the
        # remote one" — EXIT 0, nothing published. Aligning first narrows that window but cannot
        # close it: ploeg run 159 lost a release to a push that landed 19s after the align step and
        # 29s before this check, and the job went green. So detect the drop and re-run on the new
        # tip. Same guard the monorepo composite carries, where sibling package jobs race by
        # design; here the racer is an ordinary second push — rarer, and just as silent.
        #
        # Both symptoms lose before the tag exists, so reset-and-rerun is safe. The log grep is
        # what catches the behind-remote case, since rc alone cannot distinguish it from success.
        dry_run="${{ inputs.dry-run }}"
        # Only a branch push can be reset onto a moved tip — on a tag or PR ref, origin/$REF_NAME is
        # not a branch. Such a run cannot hit this race either, since nothing pushes to that ref.
        on_branch=false
        [[ "${GITHUB_REF:-}" == refs/heads/* ]] && on_branch=true

        for attempt in 1 2 3; do
          set +e
          "$sr" "${args[@]}" 2>&1 | tee /tmp/semrel.log
          rc=${PIPESTATUS[0]}
          set -e
          # A dry run publishes nothing, so a dropped release is not a dropped release: report the
          # analysis and leave the validation gate green rather than failing it on a race.
          if [ "$rc" -eq 0 ] && { [ "$dry_run" == "true" ] || ! grep -q 'is behind the remote one' /tmp/semrel.log; }; then
            break
          fi
          if [ "$attempt" -lt 3 ] && [ "$on_branch" == true ] && [ "$dry_run" != "true" ] \
             && grep -Eq 'fetch first|non-fast-forward|is behind the remote one' /tmp/semrel.log; then
            echo "::warning::a concurrent push moved ${GITHUB_REF_NAME} mid-run (attempt ${attempt}); resetting onto the updated branch and retrying"
            git -C "$GITHUB_WORKSPACE" fetch --tags origin "$GITHUB_REF_NAME"
            git -C "$GITHUB_WORKSPACE" reset --hard "origin/$GITHUB_REF_NAME"
            continue
          fi
          # Retries exhausted, or a non-retryable error. rc can still be 0 here (behind-remote on
          # the final attempt) — that is a DROPPED release, not a success. Fail loudly.
          [ "$rc" -eq 0 ] && rc=1
          exit "$rc"
        done

    - name: Release summary
      if: always()
      shell: bash
      env:
        VERSION: ${{ steps.semantic-release.outputs.version }}
        TAG: ${{ steps.semantic-release.outputs.tag }}
        OUTCOME: ${{ steps.semantic-release.outcome }}
        DRY_RUN: ${{ inputs.dry-run }}
        FORGE_URL: ${{ inputs.forge-url }}
      run: |
        set -euo pipefail
        {
          echo "### Semantic Release"
          echo
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run — no tag, release or commit was pushed."
          elif [[ "$OUTCOME" == "failure" ]]; then
            # A failure after "Created tag" means the tag and release commit are already pushed;
            # a re-run will not publish them (semantic-release sees the tag), so say so.
            pushed="$(sed 's/\x1b\[[0-9;]*m//g' /tmp/semrel.log 2>/dev/null | grep -oE 'Created tag [^ ]+' | tail -1 | cut -d' ' -f3 || true)"
            echo "**semantic-release failed.** See the job log for the failing step."
            if [[ -n "$pushed" ]]; then
              echo
              echo "The tag [\`${pushed}\`](${FORGE_URL}/${GITHUB_REPOSITORY}/src/tag/${pushed}) and its release commit"
              echo "were already pushed, so re-running this job will not publish them. If the release page"
              echo "is missing, create it on the existing tag: [new release](${FORGE_URL}/${GITHUB_REPOSITORY}/releases/new?tag=${pushed})."
            fi
          elif [[ -n "$VERSION" ]]; then
            echo "- **version**: \`${VERSION}\`"
            [[ -n "$TAG" ]] && echo "- **tag**: [\`${TAG}\`](${FORGE_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          else
            echo "No release cut for this run (no releasable commits, or the config emitted no"
            echo "\`version=\` to \`\$GITHUB_OUTPUT\` from its exec successCmd)."
          fi
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
