name: "[Action] Semantic Release"
description: >-
  Cut a repository's release with webgrip-release, the command in @webgrip/semantic-release-config.
  Run the job in harbor.webgrip.dev/webgrip/semantic-release:2.4.0 or newer, which carries the
  command, semantic-release and the locked plugin set. This action maps its inputs onto the
  command's options; the release behaviour, its tests and its documentation live in
  webgrip/semantic-release-config.

inputs:
  release-type:
    description: "The type of release"
    required: false
  token:
    description: "Forgejo token to use for checkout/push and releases"
    required: false
  forge-url:
    description: "Public Forgejo base URL used for user-facing changelog/release links (not for API traffic)"
    required: false
    default: "https://forgejo.webgrip.dev"
  git-user-name:
    description: "Account name matching the token, used for push auth against the public host"
    required: false
    default: "webgrip-ci"
  git-user-email:
    description: "Git email for the commit taggedFiles writes on no branch (config 2.x commits nothing else)"
    required: false
    default: "ci@webgrip.nl"
  dry-run:
    description: "Run semantic-release with --dry-run (no tags, releases, or commits; also skips the baseline seed)"
    required: false
    default: "false"
  align-to-remote-tip:
    description: >-
      Before releasing a branch push, move the checkout onto the remote branch tip. A push landing
      after this run was queued leaves the detached checkout BEHIND origin, and semantic-release
      then aborts with "The local branch is behind the remote one" and cuts nothing — a silent
      no-op, and one nothing else recovers from when the commit that overtook it is a `[skip ci]`
      release commit. This closes the wide window (queued-then-overtaken); the run step catches
      what is left, since a push can still land in the seconds between this step and that one.
    required: false
    default: "true"
  install-dependencies:
    description: >-
      Install the CONSUMER's dependencies from its npm lockfile (package-lock.json or
      npm-shrinkwrap.json) and then run its build script, for repos whose config or prepareCmd
      needs them (e.g. @semantic-release/wordpress). The build runs only after a successful
      install. "auto" (default) never fails the release: a missing or unsupported lockfile, a
      failed install and a failed build are each logged and skipped. "true" makes every one of
      those fatal. "false" skips the step.
    required: false
    default: "auto"
  layout:
    description: >-
      How the repository versions (homelab ADR-0088). "single" runs semantic-release once at the
      repository root. "trains" runs it once per directory that matches trains, all in this job,
      with RELEASE_TRAIN (the directory's name) and RELEASE_TRAIN_PATH (its path) in the
      environment, so one root .releaserc.cjs serves every train:
      makeConfig({ monorepo: { name: process.env.RELEASE_TRAIN, path: process.env.RELEASE_TRAIN_PATH } }).
      A train with no commit under its path since its last tag is skipped without running
      semantic-release. "upstream" takes the version from version-command, and when the tag
      v<version> does not exist yet, tags HEAD and publishes a forge release listing the commits
      since the previous tag.
    required: false
    default: "single"
  trains:
    description: "Space-separated globs of the train directories for layout trains, e.g. 'skills/*' or 'packages/* apps/site'"
    required: false
    default: ""
  version-command:
    description: >-
      Shell command that prints the bare version for layout upstream, run at the repository root,
      e.g. '. ./build.env && echo "$KATA_VERSION-webgrip.$EXTENSION_REVISION"'
    required: false
    default: ""

outputs:
  version:
    description: "Bare semver of the release (empty if none)"
    value: ${{ steps.semantic-release.outputs.version }}
  tag:
    description: "Full git tag of the release, e.g. v1.0.14 (empty if none; needed as the checkout ref for tag-pinned follow-up jobs like helm-chart-push)"
    value: ${{ steps.semantic-release.outputs.tag }}
  released:
    description: >-
      JSON array of the releases this run cut, one {"train", "version", "tag"} per release; train is
      empty for layouts single and upstream. "[]" when nothing was released.
    value: ${{ steps.semantic-release.outputs.released }}

runs:
  using: "composite"
  steps:
    - name: Check out repo
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        token: ${{ inputs.token || github.token }}

    - name: Run webgrip-release
      id: semantic-release
      shell: bash
      env:
        RELEASE_TOKEN: ${{ inputs.token || github.token }}
        FORGE_URL: ${{ inputs.forge-url }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        RELEASE_LAYOUT: ${{ inputs.layout }}
        RELEASE_TRAIN_GLOBS: ${{ inputs.trains }}
        RELEASE_VERSION_COMMAND: ${{ inputs.version-command }}
        RELEASE_INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        ALIGN_TO_REMOTE_TIP: ${{ inputs.align-to-remote-tip }}
      run: |
        set -euo pipefail
        if ! command -v webgrip-release >/dev/null 2>&1; then
          echo "::error::webgrip-release is not on PATH, so this job does not run in a release toolchain image that carries it."
          echo "::error::Run the release job in harbor.webgrip.dev/webgrip/semantic-release:2.4.0 or newer:"
          echo "::error::  container:"
          echo "::error::    image: harbor.webgrip.dev/webgrip/semantic-release:2.5.0"
          exit 1
        fi
        align=--align
        [[ "${ALIGN_TO_REMOTE_TIP}" == "true" ]] || align=--no-align
        webgrip-release "$align"
