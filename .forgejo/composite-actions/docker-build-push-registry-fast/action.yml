name: "[Action] Build and Push Docker Image (Registry, fast)"
description: >
  Fast variant of docker-build-push-registry: identical build/login/tag-normalization/summary/cache
  logic, but defaults to a SINGLE platform (linux/amd64) and only sets up QEMU when a non-amd64
  arch is actually requested. The homelab is amd64-only (Talos), so emulated arm64 — the single
  biggest build-time cost — is skipped by default. See ADR-0036. Constrictor sibling of
  docker-build-push-registry; callers migrate onto the -fast reusable workflows one at a time and
  the original is removed once nothing references it. buildx is KEPT (the docker-container driver is
  required for `cache-to: type=registry` to export); the Harbor registry layer cache is unchanged.

  # WHY THIS CALLS THE DOCKER CLI INSTEAD OF docker/*-action
  #
  # Measured on run 224: "Set up job" took 2m04s against 21s of actual build. act does not download
  # actions the way GitHub does. GitHub's runner fetches a TARBALL of a single ref from the API —
  # build-push-action@v6 is ~1MB and lands in under a second. act `git clone`s the action repo,
  # full history, all refs, into a per-pod cache that dies with the pod:
  #
  #   docker/build-push-action@v6    181 MB   58.6s
  #   docker/login-action@v3         134 MB   27.7s
  #   docker/setup-buildx-action@v3   66 MB   15.9s
  #   docker/setup-qemu-action@v3     35 MB    9.0s   <- and its `if:` was FALSE; act fetches
  #                                                      every `uses:` before evaluating conditions
  #   actions/github-script@v8         8 MB    2.9s
  #
  # ~416 MB of git history to format command-line arguments. The actions are not wasteful; act's
  # fetch strategy is, and it is not configurable. The ci-runner image already ships the docker CLI
  # and buildx v0.34.1 at /usr/local/lib/docker/cli-plugins/docker-buildx, so the wrappers buy
  # nothing here that the CLI does not already do.
  #
  # This is not a new pattern in this codebase: @webgrip/semantic-release-config's dockerVerifyGate()
  # already drives `docker buildx create` + `docker buildx build` directly, in the release job, with
  # no setup action anywhere. The invocation below deliberately mirrors the one it has been running
  # in production — same driver, same buildkit image, same shape.

inputs:
  registry:
    description: "Target registry host, e.g. harbor.webgrip.dev."
    required: true
  docker-context:
    description: "Docker context"
    required: true
    default: "."
  docker-file:
    description: "Dockerfile path from the context"
    required: true
    default: "Dockerfile"
  docker-tags:
    description: "One tag per line: OWNER/IMAGE[:TAG] or <registry>/OWNER/IMAGE[:TAG] (defaults :latest, enforces the configured registry)"
    required: true
  platforms:
    description: "Target platforms (comma-separated). Defaults to linux/amd64; pass a multi-arch value (e.g. linux/amd64,linux/arm64) to re-enable QEMU + emulation."
    required: false
    default: "linux/amd64"
  docker-target:
    description: "Docker target"
    required: false
    default: ""
  docker-build-args:
    description: "Docker build args (newline-separated KEY=VALUE entries)"
    required: false
    default: ""
  compression:
    description: "Layer compression for the pushed image: 'gzip' (default) or 'zstd'. zstd layers decompress ~2x faster on pull; opt-in because very old dockerd cannot pull zstd."
    required: false
    default: "gzip"
  buildkit-image:
    description: "BuildKit image for the docker-container driver. Defaults to the Harbor dockerhub proxy so the builder itself is not an anonymous Docker Hub pull on every build."
    required: false
    # Tag AND digest, because a digest always wins over a tag — so pinning both lets Renovate move
    # the tag while the build keeps using exactly the image that was reviewed. `buildx-stable-1` is
    # a FLOATING tag that upstream repoints; without the digest, the thing bootstrapping every build
    # in this org could change under us with no commit anywhere.
    # renovate: datasource=docker depName=moby/buildkit versioning=docker
    default: "harbor.webgrip.dev/dockerhub/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec"
  binfmt-image:
    description: "binfmt installer image, used only when a non-amd64 platform is requested."
    required: false
    # Was `:latest` in the first draft of this change, which is worse than what it replaced: an
    # unpinned, mutable image run with --privileged. Digest-pinned.
    # renovate: datasource=docker depName=tonistiigi/binfmt versioning=docker
    default: "harbor.webgrip.dev/dockerhub/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    # Fail here rather than 40 lines into a buildx invocation with a confusing error. buildx comes
    # from the ci-runner image (inherited from the actions-runner base), which is a property no
    # workflow can see — so assert it instead of assuming it.
    - name: Verify docker toolchain
      shell: bash
      run: |
        set -euo pipefail
        command -v docker >/dev/null \
          || { echo "::error::docker CLI not on PATH. This action drives the CLI directly; runs-on must provide it."; exit 1; }
        docker buildx version >/dev/null 2>&1 \
          || { echo "::error::docker buildx plugin missing. The ci-runner image is expected to ship it at /usr/local/lib/docker/cli-plugins/docker-buildx."; exit 1; }

    - name: Log in to registries
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
        DOCKER_TOKEN: ${{ env.DOCKER_TOKEN }}
        REGISTRY_USERNAME: ${{ env.REGISTRY_USERNAME }}
        REGISTRY_TOKEN: ${{ env.REGISTRY_TOKEN }}
      run: |
        set -euo pipefail

        # --password-stdin, never as an argv: an argument is visible in the daemon's process table
        # and in any `set -x` output. This is also what login-action does under the hood.
        if [[ -n "${DOCKER_USERNAME:-}" && -n "${DOCKER_TOKEN:-}" ]]; then
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          echo "logged in to Docker Hub for authenticated base-image pulls"
        fi

        if [[ -z "${REGISTRY_USERNAME:-}" || -z "${REGISTRY_TOKEN:-}" ]]; then
          echo "::error::REGISTRY_USERNAME/REGISTRY_TOKEN are empty; cannot push to ${REGISTRY}."
          exit 1
        fi
        printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

    # binfmt is only needed to build a non-host arch under emulation. Skipped for the amd64-only
    # default (the homelab's only arch) — this is the main speedup over the base action. Unlike the
    # `uses:` it replaces, this genuinely costs nothing when the condition is false: act fetched
    # setup-qemu-action's 35 MB regardless of its `if:`, because conditions are evaluated after
    # every action in the job has already been resolved.
    - name: Install binfmt (only when a non-amd64 arch is requested)
      if: ${{ inputs.platforms != 'linux/amd64' }}
      shell: bash
      env:
        BINFMT_IMAGE: ${{ inputs.binfmt-image }}
      run: |
        set -euo pipefail
        docker run --privileged --rm "$BINFMT_IMAGE" --install all

    - name: Create buildx builder
      id: builder
      shell: bash
      env:
        BUILDKIT_IMAGE: ${{ inputs.buildkit-image }}
      run: |
        set -euo pipefail

        # A unique name per job, for the same reason setup-buildx-action generates one: buildx keeps
        # its builder registry in the CLIENT's ~/.docker/buildx, which is empty in a fresh pod, while
        # the buildkit CONTAINER lives on the shared per-node dind daemon and outlives it. A fixed
        # name would collide with a container the client has no record of.
        name="builder-${GITHUB_RUN_ID:-0}-${GITHUB_JOB:-job}-$RANDOM"
        docker buildx create \
          --name "$name" \
          --driver docker-container \
          --driver-opt "image=${BUILDKIT_IMAGE}" \
          --buildkitd-flags '--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host' \
          --use >/dev/null
        docker buildx inspect --bootstrap --builder "$name" >/dev/null
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "buildx builder $name ready (buildkit: ${BUILDKIT_IMAGE})"

    - name: Enforce registry tag format
      id: normalized-tags
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        # Via env, not `${{ }}` interpolated into the script body: a tag containing a quote or a
        # backtick would otherwise be pasted straight into bash source.
        RAW_TAGS: ${{ inputs.docker-tags }}
      run: |
        set -euo pipefail

        if [[ -z "${REGISTRY//[[:space:]]/}" ]]; then
          echo "registry input is empty" >&2
          exit 1
        fi

        raw="$RAW_TAGS"
        if [[ -z "${raw//[[:space:]]/}" ]]; then
          echo "docker-tags input is empty" >&2
          exit 1
        fi

        normalized=()
        while IFS= read -r line; do
          tag="${line//$'\r'/}"

          # Trim leading/trailing whitespace (pure bash).
          tag="${tag#"${tag%%[![:space:]]*}"}"
          tag="${tag%"${tag##*[![:space:]]}"}"

          [[ -z "$tag" ]] && continue

          # Accept either:
          #   - OWNER/IMAGE[:TAG]
          #   - <registry>/OWNER/IMAGE[:TAG]
          if [[ "$tag" != "$REGISTRY"/* ]]; then
            # If the first component looks like a registry, reject unless it's the configured one.
            # Docker treats the first component as a registry only when it contains '.' or ':' or is 'localhost'.
            first="${tag%%/*}"
            if [[ "$tag" == */* && ( "$first" == *.* || "$first" == *:* || "$first" == "localhost" ) ]]; then
              echo "Only the '$REGISTRY' registry is allowed: '$tag'" >&2
              exit 1
            fi

            if [[ "$tag" != */* ]]; then
              echo "Tag must be 'OWNER/IMAGE[:TAG]' or '$REGISTRY/OWNER/IMAGE[:TAG]': '$tag'" >&2
              exit 1
            fi
            tag="$REGISTRY/$tag"
          fi

          # Default tag to :latest.
          if [[ "$tag" == *: ]]; then
            tag="${tag}latest"
          elif [[ "$tag" != *:* ]]; then
            tag="${tag}:latest"
          fi

          normalized+=("$tag")
        done <<< "$raw"

        if (( ${#normalized[@]} == 0 )); then
          echo "No valid tags found" >&2
          exit 1
        fi

        {
          echo 'tags<<EOF'
          printf '%s\n' "${normalized[@]}"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - name: Get cache tag
      id: cache-tag
      shell: bash
      env:
        TAGS: ${{ steps.normalized-tags.outputs.tags }}
      run: |
        # Split the normalized tags by newline, ignore empty lines, and select the first tag.
        primary=$(echo "$TAGS" | grep -v '^\s*$' | head -n 1)
        # Use :cache to avoid conflicts with the image's actual release tags.
        cache="${primary%:*}:cache"
        echo "cache_tag=$cache" >> "$GITHUB_OUTPUT"

    - name: Build and push image
      id: build
      shell: bash
      env:
        BUILDER: ${{ steps.builder.outputs.name }}
        CONTEXT: ${{ inputs.docker-context }}
        DOCKERFILE: ${{ inputs.docker-file }}
        PLATFORMS: ${{ inputs.platforms }}
        TARGET: ${{ inputs.docker-target }}
        COMPRESSION: ${{ inputs.compression }}
        CACHE_TAG: ${{ steps.cache-tag.outputs.cache_tag }}
        TAGS: ${{ steps.normalized-tags.outputs.tags }}
        RAW_BUILD_ARGS: ${{ inputs.docker-build-args }}
      run: |
        set -euo pipefail

        args=(
          buildx build
          --builder "$BUILDER"
          --file "${CONTEXT}/${DOCKERFILE}"
          --platform "$PLATFORMS"
          --cache-from "type=registry,ref=${CACHE_TAG}"
          --cache-to   "type=registry,ref=${CACHE_TAG},mode=max,compression=zstd"
          # SLSA build provenance + an SBOM, emitted by BuildKit as OCI referrers alongside the
          # image.
          #
          # This closes the largest regression from the GitHub migration. webgrip/infrastructure
          # ADR-0004 records it plainly: actions/attest-build-provenance had no Forgejo analog, so
          # the signature proved WHO built an image and nothing proved HOW. BuildKit generates the
          # same in-toto SLSA predicate natively, with no GitHub involvement.
          #
          # mode=max records the full build definition including build-args. Verified safe for
          # current callers — the args in use are REGISTRY_* prefixes and
          # IMAGE_CREATED/VERSION/REVISION, none of them secret. DO NOT pass a credential as a
          # build-arg while this is on; use a secret mount, which is the correct mechanism
          # regardless.
          # `--provenance=mode=max`, not `--provenance mode=max`: buildx declares both of these with
          # a NoOptDefVal so that a bare `--sbom` means `--sbom=true`. Passed as two argv elements,
          # the flag would take its default and the VALUE would be parsed as a positional argument —
          # silently becoming the build context.
          --provenance=mode=max
          --sbom=true
          --metadata-file /tmp/buildx-metadata.json
        )

        while IFS= read -r line; do
          tag="${line//$'\r'/}"
          [[ -z "${tag//[[:space:]]/}" ]] && continue
          args+=(--tag "$tag")
        done <<< "$TAGS"

        # Build-args arrive as a newline-separated block. Each line is passed as ONE argv element so
        # a value containing spaces survives; only blank lines are dropped.
        while IFS= read -r line; do
          arg="${line//$'\r'/}"
          [[ -z "${arg//[[:space:]]/}" ]] && continue
          args+=(--build-arg "$arg")
        done <<< "$RAW_BUILD_ARGS"

        [[ -n "${TARGET//[[:space:]]/}" ]] && args+=(--target "$TARGET")

        # zstd layers decompress ~2x faster on pull; opt-in because very old dockerd cannot pull
        # zstd. When zstd, push is expressed via an explicit image output; when gzip, plain --push.
        # Never both — that would double-express the push.
        if [[ "$COMPRESSION" == "zstd" ]]; then
          args+=(--output "type=image,compression=zstd,compression-level=3,force-compression=true,push=true")
        else
          args+=(--push)
        fi

        args+=("$CONTEXT")

        printf 'docker'; printf ' %q' "${args[@]}"; printf '\n'
        docker "${args[@]}"

        # buildx writes the pushed digest here; build-push-action's `digest` output is the same
        # value read the same way.
        digest=""
        if [[ -f /tmp/buildx-metadata.json ]]; then
          digest="$(jq -r '."containerimage.digest" // empty' /tmp/buildx-metadata.json)"
          {
            echo 'metadata<<EOF'
            cat /tmp/buildx-metadata.json
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        fi
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    # Replaces the post-steps the actions registered, which act DOES run — they are just folded into
    # "Complete job" instead of appearing as their own step, which is why they are easy to miss:
    #
    #   ⭐ Run Post Set up Docker Buildx
    #     [command]/usr/bin/docker buildx rm builder-0798c774-…
    #   ⭐ Run Post Log in to Harbor
    #     [command]/usr/bin/docker logout harbor.webgrip.dev
    #
    # So this is not new cleanup; it is the cleanup that already existed, made visible. The buildkit
    # container matters because it runs on the shared per-node dind daemon rather than in this pod,
    # so it would outlive the job. The logout matters less — pods are ephemeral and take one job —
    # but dropping it would still be a silent behaviour change.
    #
    # The real fix is to stop creating a builder per job at all: a long-lived buildkitd reached via
    # the `remote` driver removes the create, the bootstrap AND this step, and keeps a warm local
    # cache between builds instead of starting cold every time.
    - name: Clean up builder and credentials
      if: always()
      shell: bash
      env:
        BUILDER: ${{ steps.builder.outputs.name }}
        REGISTRY: ${{ inputs.registry }}
        DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
      run: |
        [[ -n "${BUILDER:-}" ]] && docker buildx rm --force "$BUILDER" >/dev/null 2>&1
        docker logout "$REGISTRY" >/dev/null 2>&1
        [[ -n "${DOCKER_USERNAME:-}" ]] && docker logout >/dev/null 2>&1
        exit 0

    - name: Render build summary
      if: always()
      shell: bash
      env:
        BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        BUILD_TAGS: ${{ steps.normalized-tags.outputs.tags }}
        BUILD_CONTEXT: ${{ inputs.docker-context }}
        BUILD_FILE: ${{ inputs.docker-file }}
        BUILD_PLATFORMS: ${{ inputs.platforms }}
        BUILD_TARGET: ${{ inputs.docker-target }}
        BUILD_CACHE_TAG: ${{ steps.cache-tag.outputs.cache_tag }}
      run: |
        set -euo pipefail

        ctx="${BUILD_CONTEXT:-.}"
        {
          echo "## Docker Build and Push (Registry, fast)"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Context | \`${ctx}\` |"
          echo "| Dockerfile | \`${ctx}/${BUILD_FILE:-Dockerfile}\` |"
          echo "| Platforms | ${BUILD_PLATFORMS:--} |"
          echo "| Target | ${BUILD_TARGET:--} |"
          echo "| Cache tag | \`${BUILD_CACHE_TAG:--}\` |"
          echo "| Digest | \`${BUILD_DIGEST:--}\` |"
          echo ""

          if [[ -n "${BUILD_TAGS//[[:space:]]/}" ]]; then
            echo "### Published Tags"
            echo ""
            while IFS= read -r line; do
              tag="${line//$'\r'/}"
              [[ -z "${tag//[[:space:]]/}" ]] && continue
              echo "- \`${tag}\`"
            done <<< "$BUILD_TAGS"
            echo ""
          fi

          if [[ -n "${BUILD_METADATA//[[:space:]]/}" ]]; then
            echo "<details><summary><strong>Build metadata</strong></summary>"
            echo ""
            echo '```json'
            printf '%s\n' "$BUILD_METADATA"
            echo '```'
            echo ""
            echo "</details>"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
