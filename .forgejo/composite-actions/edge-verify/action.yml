name: "[Action] Verify a site on the live edge"
description: >-
  Waits until an origin answers its probe path, then asserts that every smoke path answers 200,
  that the not-found path answers 404, and, when asked, that every rule in the consumer's
  public/_redirects answers its status. Each request retries, because an edge can take a minute
  to serve a new deploy or version.

inputs:
  origin:
    description: "Origin to verify, no trailing slash (e.g. 'https://twente.dev' or a workers.dev alias URL)"
    required: true
  probe-path:
    description: "Path polled until it answers probe-expect"
    required: false
    default: "/"
  probe-expect:
    description: "Status the probe must answer; '302' for a hostname behind Cloudflare Access"
    required: false
    default: "200"
  smoke-paths:
    description: "Newline-separated paths that must answer 200"
    required: false
    default: ""
  not-found-path:
    description: "A path that must answer 404, proving the error page is not a soft-404; empty skips it"
    required: false
    default: ""
  check-redirects:
    description: "'true' checks every public/_redirects rule against the origin"
    required: false
    default: "false"
  working-directory:
    description: "Directory holding public/_redirects"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Verify the edge
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ORIGIN: ${{ inputs.origin }}
        PROBE: ${{ inputs.probe-path }}
        PROBE_EXPECT: ${{ inputs.probe-expect }}
        SMOKE_PATHS: ${{ inputs.smoke-paths }}
        NOT_FOUND_PATH: ${{ inputs.not-found-path }}
        CHECK_REDIRECTS: ${{ inputs.check-redirects }}
      run: |
        set -euo pipefail

        for attempt in $(seq 1 12); do
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${ORIGIN}${PROBE}" || echo 000)"
          [ "${code}" = "${PROBE_EXPECT}" ] && { echo "edge ready after ${attempt} attempt(s)"; break; }
          echo "waiting for edge (${PROBE} -> ${code}, expected ${PROBE_EXPECT}, attempt ${attempt}/12)"
          [ "${attempt}" = "12" ] && { echo "FAIL: edge never became ready"; exit 1; }
          sleep 10
        done

        answers() {
          local path="$1" want="$2" code attempt
          for attempt in $(seq 1 6); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${ORIGIN}${path}" || echo 000)"
            [ "${code}" = "${want}" ] && break
            [ "${attempt}" = "6" ] || sleep 10
          done
          echo "${path} -> ${code} (expected ${want}, attempt ${attempt}/6)"
          [ "${code}" = "${want}" ]
        }

        while IFS= read -r path; do
          [ -n "${path}" ] || continue
          answers "${path}" 200 || { echo "FAIL ${path} (expected 200)"; exit 1; }
        done <<< "${SMOKE_PATHS}"

        if [ -n "${NOT_FOUND_PATH}" ]; then
          answers "${NOT_FOUND_PATH}" 404 || { echo "FAIL: soft-404, the error page is not served with 404"; exit 1; }
        fi

        if [ "${CHECK_REDIRECTS}" = "true" ]; then
          if [ ! -f public/_redirects ]; then
            echo "no public/_redirects, nothing to check"
            exit 0
          fi
          while read -r src target status _rest; do
            case "${src}" in ''|'#'*) continue ;; esac
            [ -n "${status}" ] || continue
            answers "${src}" "${status}" || { echo "FAIL ${src}"; exit 1; }
          done < public/_redirects
        fi
