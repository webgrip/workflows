name: "[Action] Semantic Release (Monorepo)"
description: >-
  Run semantic-release for a single monorepo package path (e.g. ops/docker/<image> or
  deploy/charts/<chart>) without committing a fabricated package.json. Expects to run in the
  toolchain image (harbor.webgrip.dev/webgrip/semantic-release-monorepo:1.0.0 — see
  docs/adrs/0005-semantic-release-toolchain-image.md), which bakes in node, git, yq,
  semantic-release 25, @webgrip/semantic-release-config and semantic-release-monorepo, so this
  action installs nothing. Config is resolved by cosmiconfig upward from the package directory: a
  package-local .releaserc(.cjs) wins, otherwise the nearest ancestor config (usually the repo root
  .releaserc.js). Output contract: the resolved config must include an @semantic-release/exec
  successCmd that writes `version=${nextRelease.version}` (and optionally `tag=${nextRelease.gitTag}`)
  to $GITHUB_OUTPUT — without it the action's outputs stay empty even when a release is cut.

inputs:
  package-path:
    description: "Path to the package directory (repo-relative), e.g. ops/docker/helm-deploy, or '.' for a root-scoped train"
    required: true
  package-name:
    description: "Package name for the fabricated package.json (semantic-release-monorepo derives its default tag prefix from it; an explicit tagFormat in the resolved config wins)"
    required: true
  token:
    description: "Forgejo token to use for pushing tags/releases"
    required: false
  config-version:
    description: "Pin of @webgrip/semantic-release-config for the no-image fallback only; inside the toolchain image the image tag IS the version"
    required: false
    default: "1"
  monorepo:
    description: >-
      Retained for caller compatibility and now a no-op: semantic-release-monorepo is baked into the
      monorepo toolchain image, so there is nothing left to install conditionally. The shared config
      still does not depend on it (2026-07-26 security cleanup) — the image carries it instead, which
      keeps it out of every other consumer's dependency tree.
    required: false
    default: "false"
  forge-url:
    description: "Public Forgejo base URL used for user-facing changelog/release links (not for API traffic)"
    required: false
    default: "https://forgejo.webgrip.dev"
  dry-run:
    description: "Run semantic-release with --dry-run (no tags, releases, or commits)"
    required: false
    default: "false"
  git-user-name:
    description: "Git identity for release commit-backs (@semantic-release/git) and push auth"
    required: false
    default: "webgrip-ci"
  git-user-email:
    description: "Git email for release commit-backs"
    required: false
    default: "ci@webgrip.nl"

outputs:
  version:
    description: "The new version number (from the config's exec successCmd writing to $GITHUB_OUTPUT; may be tag-prefixed under semantic-release-monorepo — normalize in the caller)"
    value: ${{ steps.semantic-release.outputs.version }}
  tag:
    description: "The full git tag of the cut release (from the config's exec successCmd; empty if no release)"
    value: ${{ steps.semantic-release.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Run semantic-release
      shell: bash
      id: semantic-release
      env:
        # Required by @webgrip/semantic-release-config at load time (Forgejo is the sole release
        # authority). Harmless for inline configs that don't read it.
        SEMANTIC_RELEASE_GITEA: "true"
        # Split addressing: the release API call stays in-cluster (github.server_url on the runner)
        # so it never hairpins out through the ingress, while the user-facing changelog/release
        # links use the public host (forge-url) via --repository-url below.
        GITEA_URL: ${{ github.server_url }}
        GITEA_TOKEN: ${{ inputs.token || github.token }}
        # GIT_CREDENTIALS is what semantic-release core reads to build an authenticated push URL
        # for --repository-url. Components must be URL-encoded if they contain reserved characters.
        GIT_CREDENTIALS: ${{ inputs.git-user-name }}:${{ inputs.token || github.token }}
        GIT_AUTHOR_NAME: ${{ inputs.git-user-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-user-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-user-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail
        forge_url="${{ inputs.forge-url }}"

        # semantic-release runs raw git commands (ls-remote during branch expansion, fetch, push)
        # against --repository-url — the PUBLIC host. The checkout only persists an auth header for
        # the in-cluster host, so on a PRIVATE repo the anonymous ls-remote 401s before
        # GIT_CREDENTIALS (which only covers semantic-release's own authUrl path) ever applies.
        # Grant git the same style of credential checkout uses, scoped to this checkout.
        auth_b64="$(printf '%s:%s' "x-access-token" "${GITEA_TOKEN}" | base64 -w0)"
        git -C "${GITHUB_WORKSPACE}" config "http.${forge_url}/.extraheader" "AUTHORIZATION: basic ${auth_b64}"

        pkg_dir="${GITHUB_WORKSPACE}/${{ inputs.package-path }}"
        pkg_name="${{ inputs.package-name }}"
        pkg_json="$pkg_dir/package.json"
        created_pkg_json="false"

        [[ -d "$pkg_dir" ]] || { echo "package-path does not exist: $pkg_dir" >&2; exit 1; }

        if [[ ! -f "$pkg_json" ]]; then
          printf '{\n  "name": "%s",\n  "version": "0.0.0",\n  "private": true\n}\n' "$pkg_name" > "$pkg_json"
          created_pkg_json="true"
        fi

        cleanup() {
          git -C "${GITHUB_WORKSPACE}" config --unset-all "http.${forge_url}/.extraheader" || true
          [[ "$created_pkg_json" == "true" ]] && rm -f "$pkg_json"
          return 0
        }
        trap cleanup EXIT

        cd "$pkg_dir"

        dry_run="${{ inputs.dry-run }}"

        # Start every package from 0.0.0 (semantic-release otherwise hardcodes the first release to
        # 1.0.0). Prefix "v" for a "." train, else "<package-name>-v". Idempotent; no-op on dry-run.
        if [[ "$dry_run" != "true" ]]; then
          if [[ "${{ inputs.package-path }}" == "." ]]; then seed_prefix="v"; else seed_prefix="${pkg_name}-v"; fi
          if [[ -z "$(git tag -l "${seed_prefix}[0-9]*")" ]]; then
            root="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "Seeding ${seed_prefix}0.0.0 at root commit ${root}."
            git tag "${seed_prefix}0.0.0" "${root}"
            git push origin "${seed_prefix}0.0.0"
          fi
        fi

        # The toolchain is the image (ADR 0005). The fallback exists so a job that is NOT run in it
        # still releases — unlocked and loudly, which is the point: it should be visible, not fatal.
        # NB: install into the PACKAGE dir, since that is the cwd semantic-release resolves from.
        sr="${SEMREL_PREBAKED:-/nonexistent}/.bin/semantic-release"
        if [[ ! -x "$sr" ]]; then
          echo "::warning::not running in the toolchain image (SEMREL_PREBAKED unset) - installing an UNLOCKED toolchain. Run this job in harbor.webgrip.dev/webgrip/semantic-release-monorepo:1.0.0 (ADR 0005, built in webgrip/infrastructure)."
          npm config set "@webgrip:registry" "${forge_url}/api/packages/webgrip/npm/"
          npm install --no-save --no-package-lock --no-audit --no-fund \
            "@webgrip/semantic-release-config@${{ inputs.config-version }}" semantic-release-monorepo@8.0.2
          sr="./node_modules/.bin/semantic-release"
        fi

        # --repository-url pins the changelog compare/commit links and release URL to the public
        # host; semantic-release would otherwise derive it from the CI checkout's origin (internal).
        # NB: no --config flag — semantic-release has none; config resolution is cosmiconfig from cwd.
        args=(--repository-url "${forge_url}/${{ github.repository }}.git")
        [[ "$dry_run" == "true" ]] && args+=(--dry-run)

        "$sr" "${args[@]}"

    - name: Release summary
      if: always()
      shell: bash
      env:
        VERSION: ${{ steps.semantic-release.outputs.version }}
        TAG: ${{ steps.semantic-release.outputs.tag }}
        DRY_RUN: ${{ inputs.dry-run }}
        FORGE_URL: ${{ inputs.forge-url }}
        PKG: ${{ inputs.package-name }}
      run: |
        set -euo pipefail
        {
          echo "### Semantic Release — \`${PKG}\`"
          echo
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run — no tag, release or commit was pushed."
          elif [[ -n "$VERSION" ]]; then
            echo "- **version**: \`${VERSION}\`"
            [[ -n "$TAG" ]] && echo "- **tag**: [\`${TAG}\`](${FORGE_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
          else
            echo "No release cut for this run (no releasable commits under this package path, or"
            echo "the config emitted no \`version=\` to \`\$GITHUB_OUTPUT\` from its exec successCmd)."
          fi
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
