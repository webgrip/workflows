name: "[Action] Semantic Release (Monorepo)"
description: >-
  Run semantic-release for a single monorepo package path (e.g. ops/docker/<image> or
  deploy/charts/<chart>) without committing a fabricated package.json. Config is resolved by
  cosmiconfig upward from the package directory: a package-local .releaserc(.cjs) wins,
  otherwise the nearest ancestor config (usually the repo root .releaserc.js). Output contract:
  the resolved config must include an @semantic-release/exec successCmd that writes
  `version=${nextRelease.version}` (and optionally `tag=${nextRelease.gitTag}`) to
  $GITHUB_OUTPUT — without it the action's outputs stay empty even when a release is cut.

inputs:
  package-path:
    description: "Path to the package directory (repo-relative), e.g. ops/docker/helm-deploy, or '.' for a root-scoped train"
    required: true
  package-name:
    description: "Package name for the fabricated package.json (semantic-release-monorepo derives its default tag prefix from it; an explicit tagFormat in the resolved config wins)"
    required: true
  token:
    description: "Forgejo token to use for pushing tags/releases"
    required: false
  config-version:
    description: "Pin of @webgrip/semantic-release-config to install (npm dist-tag or semver range)"
    required: false
    default: "1"
  forge-url:
    description: "Public Forgejo base URL used for user-facing changelog/release links (not for API traffic)"
    required: false
    default: "https://forgejo.webgrip.dev"
  dry-run:
    description: "Run semantic-release with --dry-run (no tags, releases, or commits)"
    required: false
    default: "false"
  git-user-name:
    description: "Git identity for release commit-backs (@semantic-release/git) and push auth"
    required: false
    default: "webgrip-ci"
  git-user-email:
    description: "Git email for release commit-backs"
    required: false
    default: "ci@webgrip.nl"

outputs:
  version:
    description: "The new version number (from the config's exec successCmd writing to $GITHUB_OUTPUT; may be tag-prefixed under semantic-release-monorepo — normalize in the caller)"
    value: ${{ steps.semantic-release.outputs.version }}
  tag:
    description: "The full git tag of the cut release (from the config's exec successCmd; empty if no release)"
    value: ${{ steps.semantic-release.outputs.tag }}

runs:
  using: "composite"
  steps:
    # node is baked into the ci-runner host image; setup-node remains as fallback for
    # runners without it.
    - name: Check for preinstalled node
      id: node-check
      shell: bash
      run: |
        if command -v node >/dev/null 2>&1; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      if: steps.node-check.outputs.present != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    # Cache the npm download cache so the (unpinned-lockfile) semantic-release install resolves
    # from disk instead of re-fetching ~400 packages every run. Bump the key suffix when the
    # shared-config pin or the fallback pinned versions change.
    - name: Cache npm downloads
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-semrel-24.2.7-r3

    - name: Run semantic-release
      shell: bash
      id: semantic-release
      env:
        GITHUB_OUTPUT: $GITHUB_OUTPUT
        # Required by @webgrip/semantic-release-config at load time (Forgejo is the sole release
        # authority). Harmless for inline configs that don't read it.
        SEMANTIC_RELEASE_GITEA: "true"
        # Split addressing: the release API call stays in-cluster (github.server_url =
        # http://forgejo-http.forgejo.svc.cluster.local:3000 on the runner) so it never hairpins out
        # through the ingress, while the user-facing changelog/release links use the public host
        # (forge-url) via --repository-url below.
        GITEA_URL: ${{ github.server_url }}
        GITEA_TOKEN: ${{ inputs.token || github.token }}
        # --repository-url makes semantic-release push tags (and @semantic-release/git push
        # commits) to the PUBLIC host, which the checkout's in-cluster extraheader credential
        # does not cover. GIT_CREDENTIALS is the env var semantic-release core understands for
        # building an authenticated push URL. Components must be URL-encoded if they contain
        # reserved characters.
        GIT_CREDENTIALS: ${{ inputs.git-user-name }}:${{ inputs.token || github.token }}
        GIT_AUTHOR_NAME: ${{ inputs.git-user-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-user-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-user-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail

        # semantic-release runs raw git commands (ls-remote during branch expansion, fetch,
        # push) against --repository-url — the PUBLIC host. The checkout only persists an
        # auth header for the in-cluster host, so on a PRIVATE repo the anonymous ls-remote
        # 401s before GIT_CREDENTIALS (which only covers semantic-release's own authUrl
        # path) ever applies. Grant git the same style of credential checkout uses, scoped
        # to the checkout's local config, and remove it on exit.
        forge_url="${{ inputs.forge-url }}"
        auth_b64="$(printf '%s:%s' "x-access-token" "${GITEA_TOKEN}" | base64 -w0)"
        git -C "${GITHUB_WORKSPACE}" config "http.${forge_url}/.extraheader" "AUTHORIZATION: basic ${auth_b64}"

        pkg_dir="${GITHUB_WORKSPACE}/${{ inputs.package-path }}"
        pkg_name="${{ inputs.package-name }}"
        pkg_json="$pkg_dir/package.json"
        created_pkg_json="false"

        if [[ ! -d "$pkg_dir" ]]; then
          echo "package-path does not exist: $pkg_dir" >&2
          exit 1
        fi

        if [[ ! -f "$pkg_json" ]]; then
          printf '{\n  "name": "%s",\n  "version": "0.0.0",\n  "private": true\n}\n' "$pkg_name" > "$pkg_json"
          created_pkg_json="true"
        fi

        cleanup() {
          git -C "${GITHUB_WORKSPACE}" config --unset-all "http.${forge_url}/.extraheader" || true
          if [[ "$created_pkg_json" == "true" ]]; then
            rm -f "$pkg_json" || true
          fi
        }
        trap cleanup EXIT

        cd "$pkg_dir"

        dry_run_flag=""
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          dry_run_flag="--dry-run"
        fi

        # Start every package from 0.0.0 (semantic-release otherwise hardcodes the first release to
        # 1.0.0). Prefix "v" for a "." train, else "<package-name>-v". Idempotent; no-op on dry-run.
        if [[ "$dry_run_flag" == "" ]]; then
          if [[ "${{ inputs.package-path }}" == "." ]]; then seed_prefix="v"; else seed_prefix="${pkg_name}-v"; fi
          if [[ -z "$(git tag -l "${seed_prefix}[0-9]*")" ]]; then
            root="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "Seeding ${seed_prefix}0.0.0 at root commit ${root}."
            git tag "${seed_prefix}0.0.0" "${root}"
            git push origin "${seed_prefix}0.0.0"
          fi
        fi

        # Install the shared config so this package's .releaserc.cjs can require it by name. Its
        # dependency tree hoists semantic-release + every plugin into node_modules, so once it
        # installs, NO other npm install may run in this directory: with --no-save nothing enters
        # the stub package.json, so any later install reifies npm's ideal tree from a dep-less
        # manifest and PRUNES the config as extraneous — semantic-release then dies loading the
        # releaserc with "Cannot find module '@webgrip/semantic-release-config'".
        forge_host="${forge_url#http*://}"
        npm config set "@webgrip:registry" "${forge_url}/api/packages/webgrip/npm/"
        npm config set "//${forge_host}/api/packages/webgrip/npm/:_authToken" "${GITEA_TOKEN}"
        config_installed="true"
        npm install --no-save --no-package-lock --no-audit --no-fund \
          "@webgrip/semantic-release-config@${{ inputs.config-version }}" || {
          config_installed="false"
          echo "::warning::@webgrip/semantic-release-config install failed (fine for inline-config packages)"
        }

        # --repository-url pins the changelog compare/commit links and release URL to the public host.
        # semantic-release would otherwise derive it from the CI checkout's origin remote (internal).
        # NB: no --config flag — semantic-release has none; config resolution is cosmiconfig from cwd.
        # Fast path: the ci-runner host image prebakes the pinned toolchain at /opt/semrel
        # (env SEMREL_PREBAKED) — saves ~4 min per release job.
        if [[ -n "${SEMREL_PREBAKED:-}" && -d "${SEMREL_PREBAKED}" ]]; then
          export PATH="${SEMREL_PREBAKED}/.bin:${PATH}"
          semantic-release \
            --repository-url "${{ inputs.forge-url }}/${{ github.repository }}.git" \
            $dry_run_flag
        else
          # Fallback toolchain, ONLY when the shared config failed to install (inline-config
          # package / registry outage): running it after a successful config install would prune
          # the config from node_modules (see the install note above). @semantic-release/git +
          # changelog are in the list for consumers whose configs commit release artifacts back
          # (CHANGELOG.md, Chart.yaml, ...); semantic-release only loads plugins the resolved
          # config references, so no-commit consumers are unaffected.
          if [[ "$config_installed" != "true" ]]; then
            npm install --no-save --no-audit --no-fund \
              semantic-release@24.2.7 \
              semantic-release-monorepo@8.0.2 \
              @semantic-release/commit-analyzer@13.0.0 \
              @semantic-release/exec@7.0.3 \
              @semantic-release/git@10.0.1 \
              @semantic-release/changelog@6.0.3 \
              @saithodev/semantic-release-gitea \
              @semantic-release/release-notes-generator@14.0.0 \
              conventional-changelog-conventionalcommits@7.0.2
          fi

          npx semantic-release \
            --repository-url "${{ inputs.forge-url }}/${{ github.repository }}.git" \
            $dry_run_flag
        fi
