name: "[Action] Semantic Release (Monorepo)"
description: >-
  Run semantic-release for a single monorepo package path (e.g. ops/docker/<image> or
  deploy/charts/<chart>) without committing a fabricated package.json. Config is resolved by
  cosmiconfig upward from the package directory: a package-local .releaserc(.cjs) wins,
  otherwise the nearest ancestor config (usually the repo root .releaserc.js). Output contract:
  the resolved config must include an @semantic-release/exec successCmd that writes
  `version=${nextRelease.version}` (and optionally `tag=${nextRelease.gitTag}`) to
  $GITHUB_OUTPUT — without it the action's outputs stay empty even when a release is cut.

inputs:
  package-path:
    description: "Path to the package directory (repo-relative), e.g. ops/docker/helm-deploy, or '.' for a root-scoped train"
    required: true
  package-name:
    description: "Package name for the fabricated package.json (semantic-release-monorepo derives its default tag prefix from it; an explicit tagFormat in the resolved config wins)"
    required: true
  token:
    description: "Forgejo token to use for pushing tags/releases"
    required: false
  config-version:
    description: "Pin of @webgrip/semantic-release-config to install (npm dist-tag or semver range)"
    required: false
    default: "1"
  monorepo:
    description: >-
      Set true for consumers whose config uses makeConfig({monorepo:true}). The shared config
      deliberately does NOT bundle semantic-release-monorepo (it drags a legacy dep with security
      findings, 2026-07-26 cleanup), so it is installed here — only for monorepo consumers — instead
      of as a config dependency that would reach every consumer.
    required: false
    default: "false"
  forge-url:
    description: "Public Forgejo base URL used for user-facing changelog/release links (not for API traffic)"
    required: false
    default: "https://forgejo.webgrip.dev"
  dry-run:
    description: "Run semantic-release with --dry-run (no tags, releases, or commits)"
    required: false
    default: "false"
  git-user-name:
    description: "Git identity for release commit-backs (@semantic-release/git) and push auth"
    required: false
    default: "webgrip-ci"
  git-user-email:
    description: "Git email for release commit-backs"
    required: false
    default: "ci@webgrip.nl"

outputs:
  version:
    description: "The new version number (from the config's exec successCmd writing to $GITHUB_OUTPUT; may be tag-prefixed under semantic-release-monorepo — normalize in the caller)"
    value: ${{ steps.semantic-release.outputs.version }}
  tag:
    description: "The full git tag of the cut release (from the config's exec successCmd; empty if no release)"
    value: ${{ steps.semantic-release.outputs.tag }}

runs:
  using: "composite"
  steps:
    # node is baked into the ci-runner host image; setup-node remains as fallback.
    # Presence is not enough: the runner pool is heterogeneous and semantic-release 25
    # (pinned by @webgrip/semantic-release-config) requires node ^22.14.0 || >=24.10.0
    # — ploeg run 61 landed on a node 20 host and died on the engine check.
    - name: Check for suitable preinstalled node
      id: node-check
      shell: bash
      run: |
        ok=false
        if command -v node >/dev/null 2>&1; then
          ok=$(node -e 'const [M,m]=process.versions.node.split(".").map(Number); console.log((M===22&&m>=14)||(M===24&&m>=10)||M>24)')
          echo "found node $(node --version) (suitable=${ok})"
        fi
        echo "suitable=${ok}" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.node-check.outputs.suitable != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    # Cache the npm download cache so the (unpinned-lockfile) semantic-release install resolves
    # from disk instead of re-fetching ~400 packages every run. Bump the key suffix when the
    # shared-config pin or the fallback pinned versions change.
    - name: Cache npm downloads
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-semrel-25.0.8-r1

    # yq is required by @webgrip/semantic-release-config's helm manifest bump (Chart.yaml
    # version/appVersion) and by repo prepareCmds. The ci-runner host image will bake it in;
    # until that rolls out (and for other runners), install a pinned copy when absent.
    # common-charts run 3: prepare died "yq: not found" AFTER computing v1.0.14.
    - name: Ensure yq (helm manifest bumps)
      shell: bash
      run: |
        set -euo pipefail
        command -v yq >/dev/null 2>&1 && { echo "yq present: $(yq --version)"; exit 0; }
        # renovate: datasource=github-releases depName=mikefarah/yq
        YQ_VERSION=v4.44.3
        arch="$(uname -m)"; case "$arch" in x86_64) a=amd64;; aarch64|arm64) a=arm64;; *) echo "::error::unsupported arch: $arch"; exit 1;; esac

        # Checksums for the version pinned above, from the release's own `checksums` asset. A
        # renovate bump lands here with no recorded hash: that WARNS rather than failing, so an
        # automated version bump cannot break every consumer's release job — but the warning is
        # the signal to record the new pair.
        case "${YQ_VERSION}_${a}" in
          v4.44.3_amd64) want="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7" ;;
          v4.44.3_arm64) want="0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156" ;;
          *) want="" ;;
        esac

        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${a}" -o "$HOME/.local/bin/yq"
        if [[ -n "$want" ]]; then
          got="$(sha256sum "$HOME/.local/bin/yq" | cut -d' ' -f1)"
          if [[ "$got" != "$want" ]]; then
            echo "::error::yq checksum mismatch for ${YQ_VERSION}/${a}: expected ${want}, got ${got}"
            rm -f "$HOME/.local/bin/yq"
            exit 1
          fi
        else
          echo "::warning::no recorded sha256 for yq ${YQ_VERSION}/${a} — downloaded unverified; record the checksum in this action"
        fi
        chmod +x "$HOME/.local/bin/yq"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/yq" --version

    - name: Run semantic-release
      shell: bash
      id: semantic-release
      env:
        # Required by @webgrip/semantic-release-config at load time (Forgejo is the sole release
        # authority). Harmless for inline configs that don't read it.
        SEMANTIC_RELEASE_GITEA: "true"
        # Split addressing: the release API call stays in-cluster (github.server_url =
        # http://forgejo-http.forgejo.svc.cluster.local:3000 on the runner) so it never hairpins out
        # through the ingress, while the user-facing changelog/release links use the public host
        # (forge-url) via --repository-url below.
        GITEA_URL: ${{ github.server_url }}
        GITEA_TOKEN: ${{ inputs.token || github.token }}
        # --repository-url makes semantic-release push tags (and @semantic-release/git push
        # commits) to the PUBLIC host, which the checkout's in-cluster extraheader credential
        # does not cover. GIT_CREDENTIALS is the env var semantic-release core understands for
        # building an authenticated push URL. Components must be URL-encoded if they contain
        # reserved characters.
        GIT_CREDENTIALS: ${{ inputs.git-user-name }}:${{ inputs.token || github.token }}
        GIT_AUTHOR_NAME: ${{ inputs.git-user-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-user-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-user-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail

        # semantic-release runs raw git commands (ls-remote during branch expansion, fetch,
        # push) against --repository-url — the PUBLIC host. The checkout only persists an
        # auth header for the in-cluster host, so on a PRIVATE repo the anonymous ls-remote
        # 401s before GIT_CREDENTIALS (which only covers semantic-release's own authUrl
        # path) ever applies. Grant git the same style of credential checkout uses, scoped
        # to the checkout's local config, and remove it on exit.
        forge_url="${{ inputs.forge-url }}"
        auth_b64="$(printf '%s:%s' "x-access-token" "${GITEA_TOKEN}" | base64 -w0)"
        git -C "${GITHUB_WORKSPACE}" config "http.${forge_url}/.extraheader" "AUTHORIZATION: basic ${auth_b64}"

        pkg_dir="${GITHUB_WORKSPACE}/${{ inputs.package-path }}"
        pkg_name="${{ inputs.package-name }}"
        pkg_json="$pkg_dir/package.json"
        created_pkg_json="false"

        if [[ ! -d "$pkg_dir" ]]; then
          echo "package-path does not exist: $pkg_dir" >&2
          exit 1
        fi

        if [[ ! -f "$pkg_json" ]]; then
          printf '{\n  "name": "%s",\n  "version": "0.0.0",\n  "private": true\n}\n' "$pkg_name" > "$pkg_json"
          created_pkg_json="true"
        fi

        # Keep the registry credential in a run-scoped npmrc instead of $HOME/.npmrc: the runner's
        # HOME outlives the job on a self-hosted pool, and a release token has no business
        # surviving there. Seeded from the existing user config so a runner-level registry mirror
        # or proxy setting is not lost.
        npmrc="$(mktemp)"
        [[ -f "$HOME/.npmrc" ]] && cat "$HOME/.npmrc" > "$npmrc"
        export npm_config_userconfig="$npmrc"

        cleanup() {
          git -C "${GITHUB_WORKSPACE}" config --unset-all "http.${forge_url}/.extraheader" || true
          rm -f "$npmrc" || true
          if [[ "$created_pkg_json" == "true" ]]; then
            rm -f "$pkg_json" || true
          fi
        }
        trap cleanup EXIT

        cd "$pkg_dir"

        dry_run_flag=""
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          dry_run_flag="--dry-run"
        fi

        # Start every package from 0.0.0 (semantic-release otherwise hardcodes the first release to
        # 1.0.0). Prefix "v" for a "." train, else "<package-name>-v". Idempotent; no-op on dry-run.
        if [[ "$dry_run_flag" == "" ]]; then
          if [[ "${{ inputs.package-path }}" == "." ]]; then seed_prefix="v"; else seed_prefix="${pkg_name}-v"; fi
          if [[ -z "$(git tag -l "${seed_prefix}[0-9]*")" ]]; then
            root="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "Seeding ${seed_prefix}0.0.0 at root commit ${root}."
            git tag "${seed_prefix}0.0.0" "${root}"
            git push origin "${seed_prefix}0.0.0"
          fi
        fi

        # THE TOOLCHAIN, in preference order — see docs/adrs/0005-semantic-release-toolchain-image.md.
        # A prebaked toolchain (SEMREL_PREBAKED -> a node_modules dir on the runner image, or a
        # release container built from a locked package.json) wins when it is the SAME MAJOR this
        # action targets and carries the shared config; otherwise install. The unchecked version of
        # this branch would have paired an sr24 prebake with an sr25 config — the release runs, and
        # the config it was supposed to obey is a different generation.
        SEMREL_MAJOR=25

        prebake=false
        if [[ -n "${SEMREL_PREBAKED:-}" && -x "${SEMREL_PREBAKED}/.bin/semantic-release" ]]; then
          have="$(node -p "require('${SEMREL_PREBAKED}/semantic-release/package.json').version" 2>/dev/null || echo "0.0.0")"
          monorepo_ok=true
          [[ "${{ inputs.monorepo }}" == "true" && ! -f "${SEMREL_PREBAKED}/semantic-release-monorepo/package.json" ]] && monorepo_ok=false
          if [[ "${have%%.*}" != "$SEMREL_MAJOR" ]]; then
            echo "::notice::prebaked semantic-release ${have} is not the ${SEMREL_MAJOR}.x line this action targets - installing instead"
          elif [[ ! -f "${SEMREL_PREBAKED}/@webgrip/semantic-release-config/package.json" || "$monorepo_ok" != "true" ]]; then
            echo "::notice::prebaked toolchain is missing the shared config or semantic-release-monorepo - installing instead"
          else
            prebake=true
          fi
        fi

        if [[ "$prebake" == "true" ]]; then
          echo "Using prebaked toolchain at ${SEMREL_PREBAKED} (semantic-release ${have})"
          export PATH="${SEMREL_PREBAKED}/.bin:${PATH}"
          # This package's .releaserc.cjs does a bare require(), which resolves against its own
          # node_modules only — NODE_PATH is what makes the prebaked config resolvable from there.
          export NODE_PATH="${SEMREL_PREBAKED}${NODE_PATH:+:${NODE_PATH}}"
          run_args=(--repository-url "${{ inputs.forge-url }}/${{ github.repository }}.git")
          [[ -n "$dry_run_flag" ]] && run_args+=("$dry_run_flag")
          "${SEMREL_PREBAKED}/.bin/semantic-release" "${run_args[@]}"
          exit 0
        fi

        # Install the shared config so this package's .releaserc.cjs can require it by name. Its
        # dependency tree hoists semantic-release@25 + every plugin into node_modules. Because
        # --no-save leaves the stub package.json dep-less, the 440 packages are EXTRANEOUS, so any
        # LATER `npm install` (or `npx`, which reifies) prunes the config → "Cannot find module
        # '@webgrip/semantic-release-config'". The rule below is therefore: do the config install
        # ONCE, then run the binary it provides DIRECTLY (never npx, never a second install).
        # semantic-release-monorepo is added to THIS install (not the config's deps) for monorepo
        # consumers only — the config un-bundles it on purpose (2026-07-26 security cleanup).
        forge_host="${forge_url#http*://}"
        npm config set "@webgrip:registry" "${forge_url}/api/packages/webgrip/npm/"
        npm config set "//${forge_host}/api/packages/webgrip/npm/:_authToken" "${GITEA_TOKEN}"
        monorepo_pkg=()
        [[ "${{ inputs.monorepo }}" == "true" ]] && monorepo_pkg=("semantic-release-monorepo@8.0.2")
        config_installed="true"
        config_spec=("@webgrip/semantic-release-config@${{ inputs.config-version }}" "${monorepo_pkg[@]}")
        npm install --no-save --no-package-lock --no-audit --no-fund "${config_spec[@]}" || {
          # npm sends _authToken unconditionally once set, so an under-scoped caller token (e.g. a
          # repo-scoped bot PAT without package read access) turns this PUBLIC package into a hard
          # E401 that anonymous access would not have hit. Drop the credential and retry before
          # concluding the config is unavailable.
          echo "::notice::config install with token failed - retrying anonymously"
          npm config delete "//${forge_host}/api/packages/webgrip/npm/:_authToken" || true
          npm install --no-save --no-package-lock --no-audit --no-fund "${config_spec[@]}" || {
            config_installed="false"
            echo "::warning::@webgrip/semantic-release-config install failed (fine for inline-config packages)"
          }
        }

        # --repository-url pins the changelog compare/commit links and release URL to the public host.
        # semantic-release would otherwise derive it from the CI checkout's origin remote (internal).
        # NB: no --config flag — semantic-release has none; config resolution is cosmiconfig from cwd.
        run_args=(--repository-url "${{ inputs.forge-url }}/${{ github.repository }}.git")
        [[ -n "$dry_run_flag" ]] && run_args+=("$dry_run_flag")
        if [[ "$config_installed" == "true" ]]; then
          # The sr25 toolchain the config just installed. Direct binary, no prune.
          ./node_modules/.bin/semantic-release "${run_args[@]}"
        else
          # Inline-config consumer, no prebake: install a fallback toolchain aligned to the sr25 line
          # (so it can't reintroduce version skew), then run the direct binary.
          npm install --no-save --no-package-lock --no-audit --no-fund \
            semantic-release@25.0.8 \
            semantic-release-monorepo@8.0.2 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/git@11.0.1 \
            @semantic-release/changelog@7.0.0 \
            @saithodev/semantic-release-gitea@2.1.0 \
            conventional-changelog-conventionalcommits@10.2.1
          ./node_modules/.bin/semantic-release "${run_args[@]}"
        fi

    - name: Release summary
      if: always()
      shell: bash
      env:
        VERSION: ${{ steps.semantic-release.outputs.version }}
        TAG: ${{ steps.semantic-release.outputs.tag }}
        DRY_RUN: ${{ inputs.dry-run }}
        FORGE_URL: ${{ inputs.forge-url }}
        PKG: ${{ inputs.package-name }}
      run: |
        set -euo pipefail
        {
          echo "### Semantic Release — \`${PKG}\`"
          echo
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run — no tag, release or commit was pushed."
          elif [[ -n "$VERSION" ]]; then
            echo "- **version**: \`${VERSION}\`"
            if [[ -n "$TAG" ]]; then
              echo "- **tag**: [\`${TAG}\`](${FORGE_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            fi
          else
            echo "No release cut for this run (no releasable commits under this package path, or"
            echo "the config emitted no \`version=\` to \`\$GITHUB_OUTPUT\` from its exec successCmd)."
          fi
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
