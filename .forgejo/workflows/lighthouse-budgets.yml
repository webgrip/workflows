name: '[Call] Lighthouse Budgets'

# Enforces the consumer's lighthouserc.json budgets against a fresh build — without a
# job like this they are documentation, not gates. Lighthouse needs Chrome, which the
# runner image may not carry, so lhci runs inside a Chrome-equipped sibling container.
# Extracted from twente.dev and webgrip.nl, whose lighthouse jobs were byte-similar
# hand-synced copies.
#
# The sibling-docker rule (why `docker cp`, never a bind mount): this job itself runs
# in a container, so a -v "$PWD:..." mount resolves $PWD on the HOST daemon, where
# the checkout does not exist, and lhci sees an empty directory and passes vacuously.
#
# ADR-0005 compliant since the static-site-ci-runner image (webgrip/infrastructure):
# lhci is baked there from a committed lockfile, so this job installs nothing at
# runtime — the npm deprecation noise of @lhci's legacy tree died with the install.

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to install'
        type: string
        required: false
        default: '24'
      build-command:
        description: 'Build command producing dist/ (lighthouserc.json points at it)'
        type: string
        required: false
        default: 'pnpm build'
      working-directory:
        description: 'Directory containing package.json and lighthouserc.json'
        type: string
        required: false
        default: '.'
      extra-cp:
        description: >-
          Newline-separated extra repo paths to docker-cp into the container, e.g.
          'scripts' when lighthouserc.json starts a server via startServerCommand.
        type: string
        required: false
        default: ''
      lhci-version:
        description: >-
          DEPRECATED and ignored: lhci is baked into the toolchain image at a locked
          version (ADR-0005). Kept only so existing callers do not break; the way to
          change the scorer is a toolchain-image release.
        type: string
        required: false
        default: ''
      browsers-image:
        description: 'Toolchain image the audit runs in (Chrome + lhci baked; built in webgrip/infrastructure)'
        type: string
        required: false
        # renovate: datasource=docker depName=harbor.webgrip.dev/webgrip/static-site-ci-runner
        default: 'harbor.webgrip.dev/webgrip/static-site-ci-runner:0.1.0'
      enabled:
        description: 'Gate the job from INSIDE the reusable (Forgejo v15 flattening drops caller if-conditions on uses jobs)'
        type: boolean
        required: false
        default: true

jobs:
  lhgate:
    name: 'Lighthouse budgets'
    if: inputs.enabled
    runs-on: docker
    permissions:
      contents: read
    steps:
      # v5, not v6 — v6 is broken on non-GitHub runners (ADR 0002).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Run Lighthouse CI
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          EXTRA_CP: ${{ inputs.extra-cp }}
          IMAGE: ${{ inputs.browsers-image }}
        run: |
          set -euo pipefail
          # Container name carries the run id: the runner's docker daemon is shared
          # between repos, so a fixed name collides when two consumers audit at once.
          name="lhci-${GITHUB_RUN_ID:-local}"
          docker rm -f "${name}" >/dev/null 2>&1 || true
          docker run -d --name "${name}" -w /repo "${IMAGE}" sleep 1800
          docker cp dist "${name}:/repo/dist"
          docker cp lighthouserc.json "${name}:/repo/lighthouserc.json"
          while IFS= read -r p; do
            [ -n "${p}" ] || continue
            docker cp "${p}" "${name}:/repo/${p}"
          done <<< "${EXTRA_CP}"
          # lhci comes from the image (locked lockfile, ADR-0005) — nothing installs here.
          docker exec -w /repo "${name}" bash -c "lhci autorun"

      - name: Clean up Lighthouse container
        if: always()
        shell: bash
        run: docker rm -f "lhci-${GITHUB_RUN_ID:-local}" || true
