name: 'Rust Tests'

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Rust toolchain (stable, 1.87.0, nightly, …)'
        required: false
        default: 'stable'
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: 'Cargo Tests'
    runs-on: docker

    container:
      image: harbor.webgrip.dev/webgrip/rust-ci-runner:1.4.1@sha256:315684ea932093a86ef2ca53765cba71ee1d06bf7f3ac7b47c85c276247b9c38

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ---------- cache crates & build artefacts ----------
      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: |
            cargo-${{ runner.os }}-${{ inputs.toolchain }}-${{ hashFiles('**/Cargo.lock') }}

      # ---------- run tests (fast, parallel) ----------
      - name: Run unit + integration tests
        run: cargo nextest run --all-targets --all-features

      # ---------- generate coverage (optional) ----------
      - name: Generate coverage (Xml)
        run: cargo tarpaulin --workspace --out Xml
        continue-on-error: true

      # ---------- upload coverage artefact ----------
      - name: Upload coverage artefact
        if: always()
        uses: forgejo/upload-artifact@v4
        with:
          name: code-coverage
          path: cobertura.xml
