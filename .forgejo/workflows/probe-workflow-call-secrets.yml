name: '[Call] Probe Workflow Call Secrets'

on:
  workflow_call:
    inputs:
      passing-mode:
        description: 'How the caller hands over secrets: mapped, inherit or none'
        type: string
        required: true

jobs:
  probe-secrets:
    name: 'Probe: secrets reach an undeclared callee (${{ inputs.passing-mode }})'
    runs-on: docker
    steps:
      - name: Report what arrived
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
          WEBGRIP_CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: |
          echo "PROBE passing-mode=[${{ inputs.passing-mode }}]"
          echo "PROBE secrets.PROBE_SECRET length=${#PROBE_SECRET}"
          echo "PROBE secrets.WEBGRIP_CI_TOKEN length=${#WEBGRIP_CI_TOKEN}"

      - name: 'VERDICT mapped secret arrives without a declaration'
        if: inputs.passing-mode == 'mapped'
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          if [ -z "$PROBE_SECRET" ]; then
            echo "secrets.PROBE_SECRET is empty: an explicitly mapped secret does NOT reach a callee that does not declare it" >&2
            exit 1
          fi
          echo "secrets.PROBE_SECRET arrived (length ${#PROBE_SECRET})"

      - name: 'VERDICT inherited secret arrives without a declaration'
        if: inputs.passing-mode == 'inherit'
        env:
          WEBGRIP_CI_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
        run: |
          if [ -z "$WEBGRIP_CI_TOKEN" ]; then
            echo "secrets.WEBGRIP_CI_TOKEN is empty: secrets: inherit does NOT reach a callee that does not declare it" >&2
            exit 1
          fi
          echo "secrets.WEBGRIP_CI_TOKEN arrived (length ${#WEBGRIP_CI_TOKEN})"
