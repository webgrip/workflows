name: '[Call] Run Linting'

on:
  workflow_call:

jobs:
  eslint:
    name: 'ESLint'
    runs-on: docker
    container: node:22

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint