name: "Update TechDocs"

on:
  workflow_call:
    inputs:
      source-dir:
        type: string
        description: 'The directory containing the techdocs files'
        required: false
        default: 'docs/techdocs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-techdocs:
    name: "techdocs"
    runs-on: docker
    # techdocs-runner is just `FROM techdocs-builder` + a `mkdocs serve` entrypoint; CI runs
    # `techdocs-cli generate`, not serve, and techdocs-builder ships @techdocs/cli + mkdocs +
    # plantuml, so the runner image stays redundant here.
    # First-party Harbor image, version-pinned. Was the ghcr pull-through `:latest`, but the
    # GHCR fan-out froze AGAIN (2026-08-09: ghcr `latest` = old content under a fresh digest, no
    # mkdocs-llms-source; Harbor's 1.3.0 has it) — the same staleness that froze techdocs-runner's
    # base at 1.2.7. Private-project pulls from job containers are proven (helm-deploy, rust-releaser).
    container: harbor.webgrip.dev/webgrip/techdocs-builder:1.3.0
    steps:
      - uses: actions/checkout@v4

      - run: |
          techdocs-cli generate --no-docker --verbose --source-dir ${{ inputs.source-dir }} --output-dir techdocs-site

      # forgejo/* fork, NOT actions/*: upload-artifact@v4 ships @actions/artifact v2, which refuses
      # to run against anything that is not github.com — Forgejo reads as GHES, so the step dies
      # with "GHESNotSupportedError ... not currently supported on GHES" AFTER the docs have already
      # built successfully. Forgejo maintains a patched fork at the same major version.
      - name: Put in artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: techdocs-site
          path: techdocs-site
          retention-days: 1
