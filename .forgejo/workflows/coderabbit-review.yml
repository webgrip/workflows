name: '[Call] CodeRabbit review'

# CodeRabbit reviews no Forgejo pull request, so this job runs its CLI on the pull request's diff
# and posts the findings as one Forgejo review (agentstd review, agent-standards docs/coderabbit.md).
# Every run counts against the API key's seat: 5 reviews per hour on Essentials. Callers trigger it
# on opened, ready_for_review and a label, not on every push.
#
# ADR-0005 deviation, declared: the CodeRabbit CLI is fetched at job time by its own install script,
# pinned by version; the script verifies the signed release manifest before it installs.

on:
  workflow_call:
    inputs:
      blocking:
        description: 'Fail the job when a finding is critical or major.'
        required: false
        default: false
        type: boolean
      region:
        description: 'CodeRabbit account region of the API key: eu or us.'
        required: false
        default: 'eu'
        type: string
      cli-version:
        description: 'CodeRabbit CLI version.'
        required: false
        default: '0.9.1'
        type: string
      agentstd-ref:
        description: 'agent-standards tag whose agentstd runs the review.'
        required: false
        default: 'v0.4.0'
        type: string
      enabled:
        description: 'Gate the job from inside the reusable workflow; a caller-level if: does not reach flattened jobs.'
        required: false
        default: true
        type: boolean
    secrets:
      CODERABBIT_API_KEY:
        description: 'Agentic API key of a seated CodeRabbit user.'
        required: true

jobs:
  review:
    name: 'CodeRabbit review'
    if: ${{ inputs.enabled && github.event.pull_request.draft != true }}
    runs-on: docker
    timeout-minutes: 30
    env:
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          install: false
          cache: false
          github_token: ''

      - name: Install the CodeRabbit CLI
        shell: bash
        env:
          CODERABBIT_VERSION: ${{ inputs.cli-version }}
        run: |
          set -euo pipefail
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Review the pull request and post the findings
        shell: bash
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          CODERABBIT_REGION: ${{ inputs.region }}
          FORGE_TOKEN: ${{ github.token }}
          BLOCKING: ${{ inputs.blocking }}
          AGENTSTD_REF: ${{ inputs.agentstd-ref }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$BLOCKING" = "true" ]; then flags+=(--blocking); fi
          mise exec uv@0.12.24 -- uvx --from "git+https://forgejo.webgrip.dev/webgrip/agent-standards.git@${AGENTSTD_REF}#subdirectory=cli" agentstd review "${flags[@]}"
