name: '[Call] Run Tests'

on:
  workflow_call:

jobs:
  test:
    name: 'Unit tests'
    runs-on: docker
    steps:
      -  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test