name: '[Canary] Secrets reach an undeclared workflow_call'

on:
  push:
    branches:
      - ci/probe-workflow-call-secrets

jobs:
  mapped:
    uses: webgrip/workflows/.forgejo/workflows/probe-workflow-call-secrets.yml@7f787669b6fc67394f4a68fd8703f4e0c7874050
    with:
      passing-mode: mapped
    secrets:
      PROBE_SECRET: ${{ secrets.WEBGRIP_CI_TOKEN }}

  inherit:
    uses: webgrip/workflows/.forgejo/workflows/probe-workflow-call-secrets.yml@7f787669b6fc67394f4a68fd8703f4e0c7874050
    with:
      passing-mode: inherit
    secrets: inherit

  none:
    uses: webgrip/workflows/.forgejo/workflows/probe-workflow-call-secrets.yml@7f787669b6fc67394f4a68fd8703f4e0c7874050
    with:
      passing-mode: none
