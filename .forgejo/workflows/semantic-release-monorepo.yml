name: '[Call] Semantic Release (Monorepo)'

# Per-package release train for monorepos: runs the semantic-release-monorepo composite action
# against one package path. Commit analysis is scoped to that path by the
# semantic-release-monorepo plugin (referenced from the consumer's releaserc); config is
# resolved by cosmiconfig from the package dir upward (package .releaserc.cjs wins, else the
# repo root .releaserc.js). The consumer config must write version=/tag= to $GITHUB_OUTPUT via
# an @semantic-release/exec successCmd for this workflow's outputs to be populated.

on:
  workflow_call:
    inputs:
      package-path:
        description: 'Repo-relative package dir ("." for a root-scoped train)'
        required: true
        type: string
      package-name:
        description: 'Package name (fabricated package.json name / default tag prefix)'
        required: true
        type: string
      dry-run:
        description: 'Run semantic-release with --dry-run (no tags, releases, or commits)'
        required: false
        default: false
        type: boolean
      monorepo:
        description: 'Set true when the resolved config uses makeConfig({monorepo:true}); the composite then installs semantic-release-monorepo (the shared config un-bundles it).'
        required: false
        default: false
        type: boolean
      toolchain-image:
        description: >-
          The image the release runs in — node, git, yq, semantic-release 25,
          @webgrip/semantic-release-config and semantic-release-monorepo, all locked (ADR 0005).
          Built and released in webgrip/infrastructure (ops/docker/semantic-release-monorepo), so
          the tag is that image's own release version and this default is bumped deliberately, by a
          PR here, when the toolchain moves. Override with an image built FROM it if your prepareCmd
          needs extra tooling (helm, php, docker CLI).
        required: false
        # renovate: datasource=docker depName=harbor.webgrip.dev/webgrip/semantic-release-monorepo
        default: 'harbor.webgrip.dev/webgrip/semantic-release-monorepo:0.3.3'
        type: string
      enabled:
        description: 'Gate the job from INSIDE the reusable. Forgejo v15 flattening drops if-conditions on uses-caller jobs, so pass needs-based conditions here (needs.* survives flattening; github.* does NOT — use only-refs for branch gating).'
        required: false
        default: true
        type: boolean
      only-refs:
        description: >-
          Space-separated full refs allowed to release (e.g. "refs/heads/main
          refs/heads/development"); empty = no ref restriction. This exists because Forgejo v15
          evaluates a caller's `with:` expressions at flatten time with an EMPTY github context, so
          `enabled: ${{ github.ref == ... }}` silently gates wrong on both branches. Job-level `if:`
          on this (real) job is evaluated on the runner, where github.ref is the caller run's true
          ref — so pass the refs as static data and let the gate compare here.
        required: false
        default: ''
        type: string
      skip-refs:
        description: >-
          Space-separated full refs that must NOT run (e.g. "refs/heads/main refs/heads/development");
          empty = no exclusion. The inverse of only-refs, for a dry-run validation job that should
          run on feature branches (the PR) but not on the release branches where the real release runs.
        required: false
        default: ''
        type: string
      align-to-remote-tip:
        description: >-
          Before running semantic-release on a branch push, fast-forward the checkout onto the
          remote branch tip. A concurrent release train (e.g. an app train and a chart train fired
          by one commit that touches both) can push its own `[skip ci]` release commit after this
          run was triggered, leaving this run's detached checkout BEHIND origin — semantic-release
          then aborts with "The local branch is behind the remote one, therefore a new version
          won't be published" and cuts nothing (a silent no-op that does not self-heal, since the
          winner's commit is `[skip ci]`). Moving onto the branch tip releases from current remote
          HEAD. Default true; disable only if a repo deliberately releases a non-tip SHA.
        required: false
        default: true
        type: boolean
    secrets:
      CI_TOKEN:
        description: 'CI bot token — pass secrets.WEBGRIP_CI_TOKEN. Preferred over FORGEJO_TOKEN: a caller-mapped secret named FORGEJO_TOKEN risks resolving to the built-in per-job token of the same name (Ghost releases, no native release event, no org package writes).'
        required: false
      FORGEJO_TOKEN:
        description: 'Forgejo CI bot token used for checkout/push and releases'
        required: false
      NPM_TOKEN:
        description: >-
          Token for publishing npm packages to the Forgejo registry (configs with
          makeConfig({ manifest: 'npm', npmPublish: true })). Needs write:package — pass
          secrets.WEBGRIP_CI_TOKEN; the built-in per-run token 401s with reqPackageAccess.
          Omit for tag/changelog-only trains.
        required: false
    outputs:
      version:
        description: 'Bare semver of the release cut this run (empty if none)'
        value: ${{ jobs.semrel-monorepo.outputs.version }}
      tag:
        description: 'Full git tag of the release (e.g. chart-v1.2.3; empty if none)'
        value: ${{ jobs.semrel-monorepo.outputs.tag }}

jobs:
  # NB: job id deliberately unlikely to collide with caller job ids (release, release-chart, ...):
  # Forgejo v15 flattens reusable jobs into the caller run and rejects id collisions as cycles.
  semrel-monorepo:
    name: 'Semantic Release (monorepo)'
    # Space-padding both sides makes the ref match whole-token (refs/heads/main must not match
    # refs/heads/maintenance). github.ref is trustworthy here (runner-evaluated), unlike in the
    # caller's with: expressions (server flatten-time, empty github context).
    if: >-
      inputs.enabled
      && (inputs.only-refs == '' || contains(format(' {0} ', inputs.only-refs), format(' {0} ', github.ref)))
      && !contains(format(' {0} ', inputs.skip-refs), format(' {0} ', github.ref))
    runs-on: docker
    # The toolchain is the image, not an install (ADR 0005): node (which also runs the JS actions),
    # git, yq, semantic-release and semantic-release-monorepo are baked in, so the job does no
    # dependency resolution at all.
    container:
      image: ${{ inputs.toolchain-image }}
    permissions:
      contents: write # push release commit + tag
    outputs:
      version: ${{ steps.normalize.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          token: ${{ secrets.CI_TOKEN || secrets.FORGEJO_TOKEN || github.token }}

      # Fast-forward onto the remote branch tip so a concurrent release train that advanced the
      # branch mid-run can't strand this run "behind remote" (see the align-to-remote-tip input).
      # Fast-forward only — a release branch's tip is exactly what should be released.
      - name: Align to remote branch tip
        if: inputs.align-to-remote-tip && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git fetch --tags origin "$branch"
          git checkout -B "$branch" "origin/$branch"

      - id: release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@main
        with:
          package-path: ${{ inputs.package-path }}
          package-name: ${{ inputs.package-name }}
          token: ${{ secrets.CI_TOKEN || secrets.FORGEJO_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          dry-run: ${{ inputs.dry-run }}
          monorepo: ${{ inputs.monorepo }}

      - id: normalize
        shell: bash
        env:
          RAW: ${{ steps.release.outputs.version }}
        run: |
          # semantic-release-monorepo setups have been observed emitting both bare semver and the
          # tag-prefixed form (<name>-v1.2.3); normalize to bare semver so callers can compose
          # image tags / chart versions safely.
          echo "version=${RAW##*-v}" >> "$GITHUB_OUTPUT"
