name: 'Publish Release'

on:
  workflow_call:
    outputs:
      version:
        description: "The released version"
        value: ${{ jobs.release-publish.outputs.version }}
    secrets:
      CI_TOKEN:
        description: 'CI bot token — pass secrets.WEBGRIP_CI_TOKEN. Preferred over FORGEJO_TOKEN: a caller-mapped secret named FORGEJO_TOKEN risks resolving to the built-in per-job token of the same name (Ghost releases, no native release event, no org package writes).'
        required: false
      FORGEJO_TOKEN:
        description: "Forgejo CI bot token (repo/org-scoped) for semantic-release"
        required: false

jobs:
  release-publish:
    name: 'Publish'
    uses: webgrip/workflows/.forgejo/workflows/semantic-release.yml@main
    with:
      use-bot-to-commit: true
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN || secrets.FORGEJO_TOKEN }}
