name: '[Workflow] On Documentation Change'

# Publishes this repo's docs to docs.<domain>/workflows/ — the homelab ADR-0052
# estate rollout (path-per-repo on the shared Garage docs-site bucket):
# Zensical build + llms/redirect graft + gitleaks secret gate, prefix-scoped
# rclone sync (repos cannot clobber each other).

on:
  push:
    branches:
      - '*'
    paths:
      - 'docs/techdocs/**'
      - '.forgejo/workflows/on_docs_change.yml'
  workflow_dispatch:
    inputs:
      source-dir:
        type: string
        description: 'The directory containing the techdocs files'
        required: false
        default: 'docs/techdocs'

jobs:
  generate-documentation:
    name: 'Generate'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-generate.yml@228a37ed9ae418edb99530115cdf62f408900f8b # v4.2.0
    with:
      source-dir: ${{ github.event.inputs.source-dir || 'docs/techdocs' }}

  deploy-docs-site:
    name: 'Deploy (docs site / Garage web)'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-deploy-docs-site.yml@228a37ed9ae418edb99530115cdf62f408900f8b # v4.2.0
    needs: generate-documentation
    if: github.ref == 'refs/heads/main'
    with:
      # Own bucket (estate #2): this repo's key can touch nothing but
      # docs-workflows(-trash), so a bad sync can never clobber the estate.
      bucket: docs-workflows
      # strict:false until this repo's links are cleaned; flip like homelab did.
      strict: 'true'
    secrets:
      TECHDOCS_S3_ACCESS_KEY_ID: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      TECHDOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
