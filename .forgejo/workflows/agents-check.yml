name: '[Call] Agents check'

on:
  workflow_call:
    inputs:
      blocking:
        description: 'Fail the caller when agentstd check fails. Leave false for the first two weeks after adopting the agent standard.'
        required: false
        default: false
        type: boolean
      enabled:
        description: 'Gate the job from inside the reusable workflow; a caller-level if: does not reach flattened jobs.'
        required: false
        default: true
        type: boolean

jobs:
  agentstd:
    name: 'agentstd check'
    if: ${{ inputs.enabled }}
    runs-on: docker
    timeout-minutes: 15
    env:
      # Only uv is needed. Without this, mise exec installs the caller's whole toolset
      # (node, go tools, ...), which fails on lockfile settings and GitHub rate limits.
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: https://github.com/jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.19
          # No mise install here: with a mise.lock in the caller, mise-action adds --locked,
          # which refuses uv@0.12.24 when that lock does not list it. mise exec installs it.
          install: false
          cache: false
          github_token: ''

      - name: Check the agent files against the agent standard
        shell: bash
        env:
          # Forgejo's parser wants a literal boolean for step-level continue-on-error, so a
          # non-blocking failure is turned into a warning here instead.
          BLOCKING: ${{ inputs.blocking }}
        run: |
          set -uo pipefail
          tag=$(awk '/agent-standards(\.git)?$/ {found = 1; next} found && /ref:/ {print $2; exit}' apm.yml)
          if [ -z "$tag" ]; then
            echo "apm.yml pins no agent-standards package; adopt the standard first (agent-standards docs/adopting.md)." >&2
            exit 1
          fi
          if timeout 600 mise exec uv@0.12.24 -- uvx --from "git+https://forgejo.webgrip.dev/webgrip/agent-standards.git@${tag}#subdirectory=cli" agentstd check; then
            exit 0
          fi
          if [ "$BLOCKING" = "true" ]; then
            exit 1
          fi
          echo "::warning::agentstd check failed; non-blocking until the caller passes blocking: true"
