name: '[Call] Agents check'

on:
  workflow_call:
    inputs:
      blocking:
        description: 'Fail the caller when agentstd check fails. Leave false for the first two weeks after adopting the agent standard.'
        required: false
        default: false
        type: boolean
      enabled:
        description: 'Gate the job from inside the reusable workflow; a caller-level if: does not reach flattened jobs.'
        required: false
        default: true
        type: boolean

jobs:
  agentstd:
    name: 'agentstd check'
    if: ${{ inputs.enabled }}
    runs-on: docker
    timeout-minutes: 15
    env:
      # Only uv is needed. Without this, mise exec installs the caller's whole toolset
      # (node, go tools, ...), which fails on lockfile settings and GitHub rate limits.
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          # No mise install here: with a mise.lock in the caller, mise-action adds --locked,
          # which refuses uv@0.12.24 when that lock does not list it. mise exec installs it.
          install: false
          cache: false
          github_token: ''

      - name: Check the agent files against the agent standard
        shell: bash
        env:
          # Forgejo's parser wants a literal boolean for step-level continue-on-error, so a
          # non-blocking failure is turned into a warning here instead.
          BLOCKING: ${{ inputs.blocking }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          manifest=apm.yml
          base=()
          if [ -n "$BASE_REF" ]; then
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
              echo "the base branch is not in the checkout" >&2
              exit 1
            fi
            if git show "refs/remotes/origin/${BASE_REF}:apm.yml" > "$RUNNER_TEMP/base-apm.yml" 2>/dev/null; then
              manifest="$RUNNER_TEMP/base-apm.yml"
            fi
            base=(--base "refs/remotes/origin/${BASE_REF}")
          fi
          tag=$(awk '/agent-standards(\.git)?$/ {found = 1; next} found && /ref:/ {print $2; exit}' "$manifest")
          if [ -z "$tag" ]; then
            tag=$(awk '/agent-standards(\.git)?$/ {found = 1; next} found && /ref:/ {print $2; exit}' apm.yml)
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "apm.yml pins no agent-standards release; adopt the standard first (agent-standards docs/adopting.md)." >&2
            exit 1
          fi
          agentstd=(timeout 600 mise exec uv@0.12.24 -- uvx --from "git+https://forgejo.webgrip.dev/webgrip/agent-standards.git@${tag}#subdirectory=cli" agentstd)
          if [ ${#base[@]} -gt 0 ] && ! "${agentstd[@]}" check --help 2>/dev/null | grep -q -- '--base'; then
            echo "::warning::agent-standards ${tag} predates check --base; this run trusts the pull request's own .agentstd.toml"
            base=()
          fi
          if "${agentstd[@]}" check "${base[@]}"; then
            exit 0
          fi
          if [ "$BLOCKING" = "true" ]; then
            exit 1
          fi
          echo "::warning::agentstd check failed; non-blocking until the caller passes blocking: true"
