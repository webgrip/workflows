name: '[Call] GitHub Distribute'

# Mirrors a release out to GitHub: force-pushes the repo's branches and tags to the
# github.com twin, creates the GitHub Release for the tag (notes copied from the Forgejo
# release via the API, so the workflow_dispatch backfill path gets them too), and
# digest-copies the container image to GHCR. Sibling of forgejo-distribute.yml — same
# proven shapes: normal jobs inside a job-level reusable, imagetools for the image copy.
# First caller: webgrip/ploeg on_release_published (inlined there first, extracted here).
#
# Direction is one-way BY DESIGN: the Forgejo repo is the source of truth and every
# branch push here is --force. Never commit on the GitHub side — the next release
# overwrites it without ceremony.
#
# Identity: one GitHub account drives all three concerns — git push, the Releases API,
# and the GHCR docker login. Callers pass GH_USERNAME + GH_TOKEN, where the token is a
# CLASSIC PAT with `repo` + `write:packages`: fine-grained PATs cannot push to GHCR.
# (Secret names deliberately avoid the GITHUB_ prefix — reserved on both forges.)
#
# GHCR mirror mode mirrors forgejo-distribute's: the image is built ONCE elsewhere
# (e.g. Harbor) and copied with `docker buildx imagetools create`, which clones the
# whole multi-arch manifest list by digest — both registries serve byte-identical
# images, and a pull/tag/push loop (which would flatten to the runner's arch) is
# avoided. Callers should `needs:` the job that builds the source image. cosign
# accessories are NOT copied (imagetools moves just the image manifest list); signature
# verification stays against the source registry. NB: the first push creates the GHCR
# package PRIVATE — flip it public once in the package settings, or anonymous pulls 401.

on:
  workflow_call:
    secrets:
      GH_USERNAME:
        description: 'GitHub username the mirror acts as (git push, Releases API, GHCR login).'
        required: true
      GH_TOKEN:
        description: 'Classic PAT for that user, scopes `repo` + `write:packages` — fine-grained PATs cannot write GHCR.'
        required: true
      SOURCE_REGISTRY_USER:
        description: 'Image mirror only: pull user for mirror-from-registry (e.g. secrets.HARBOR_ROBOT_USER).'
        required: false
      SOURCE_REGISTRY_TOKEN:
        description: 'Image mirror only: pull token for mirror-from-registry.'
        required: false
    inputs:
      enabled:
        description: 'Gate the jobs from INSIDE the reusable. Forgejo v15 flattening drops if-conditions on uses-caller jobs, so pass conditions (e.g. a non-empty release version) here instead.'
        type: boolean
        required: false
        default: true
      version:
        description: 'Bare semver of the release, e.g. 1.2.3 or 0.1.0-rc.4. A hyphen marks the GitHub Release as a prerelease.'
        type: string
        required: true
      repo:
        description: 'OWNER/REPO, identical on both forges (e.g. webgrip/ploeg). Explicit because github.repository is unreliable on Forgejo workflow_dispatch.'
        type: string
        required: true
      branches:
        description: 'Space-separated branch names to force-push to GitHub. Tags are always mirrored, all of them.'
        type: string
        required: false
        default: 'main'
      create-release:
        description: 'Create the GitHub Release for v<version> after the ref mirror. Idempotent: an existing release is left untouched.'
        type: boolean
        required: false
        default: true
      owner:
        description: 'Image owner (org) on both registries. Hardcoded default because github.repository_owner is EMPTY on Forgejo workflow_dispatch.'
        type: string
        required: false
        default: 'webgrip'
      image-name:
        description: 'Container image name (e.g. ploegd). Empty skips the GHCR job.'
        type: string
        required: false
        default: ''
      mirror-from-registry:
        description: 'Registry the already-built image is copied from. Assumes the same <owner>/<image-name> path on both sides.'
        type: string
        required: false
        default: 'harbor.webgrip.dev'
      push-latest:
        description: 'Also move <image>:latest on GHCR. Callers should pass false for prereleases.'
        type: boolean
        required: false
        default: false

jobs:
  github-publish:
    name: 'Mirror & Release (GitHub)'
    if: inputs.enabled
    runs-on: docker
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TAG: v${{ inputs.version }}
    steps:
      # Preflight, because a bad GH_TOKEN does not fail loudly downstream: the git push
      # below gets a 401 from github.com, git falls back to the credential subsystem,
      # finds no helper, and blocks on a terminal prompt that never comes — the job hangs
      # until the runner-level timeout (ploeg run 170: 20+ minutes, holding a runner slot
      # while the caller job sat `blocked`). One API call turns that into a named failure
      # in seconds, and names the secret that has to be rotated.
      - name: Verify GitHub credentials
        shell: bash
        env:
          GH_USER: ${{ secrets.GH_USERNAME }}
        run: |
          set -euo pipefail
          [[ -n "$GH_USER"  ]] || { echo "ERROR: GH_USERNAME secret is empty."; exit 1; }
          [[ -n "$GH_TOKEN" ]] || { echo "ERROR: GH_TOKEN secret is empty."; exit 1; }
          code="$(curl -sS -o /tmp/gh-user.json -D /tmp/gh-user.headers -w '%{http_code}' \
            -H "Authorization: token ${GH_TOKEN}" https://api.github.com/user)"
          if [[ "$code" != 200 ]]; then
            echo "ERROR: GH_TOKEN rejected by api.github.com (HTTP ${code})."
            echo "       The secret is invalid, expired or revoked — this is not a scope"
            echo "       problem; github.com refused the credential itself."
            echo "       Fix: rotate the GH_TOKEN secret to a CLASSIC PAT owned by ${GH_USER},"
            echo "            scopes 'repo' + 'write:packages'."
            echo "            Fine-grained PATs cannot write GHCR at all."
            exit 1
          fi
          echo "github.com login: $(jq -r .login /tmp/gh-user.json)"
          # Classic PATs report their scopes in this header; fine-grained PATs send it empty.
          scopes="$(tr -d '\r' < /tmp/gh-user.headers | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: //p')"
          echo "token scopes: ${scopes:-<none — fine-grained PAT>}"
          case ",${scopes// /}," in
            *,repo,*) ;;
            *) echo "WARN:  GH_TOKEN does not carry the classic 'repo' scope — the branch/tag push may be refused." ;;
          esac
      # fetch-depth 0 = all branches and tags, so one push refreshes the whole mirror.
      # Explicit repository: inputs.repo, not the github.repository dispatch trap above.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          fetch-depth: 0
      - name: Mirror refs to GitHub
        shell: bash
        env:
          GH_USER: ${{ secrets.GH_USERNAME }}
          REPO: ${{ inputs.repo }}
          BRANCHES: ${{ inputs.branches }}
        # Token via GIT_CONFIG_* env (git ≥2.31), not the URL or -c argv: keeps it out
        # of the process list. Force: Forgejo is authoritative, the mirror never is.
        run: |
          set -euo pipefail
          # Never let git fall back to an interactive credential prompt on a 401: with no
          # tty behind it that blocks forever. Prompts off + an empty helper list means a
          # rejected token surfaces as `Authentication failed`, immediately.
          export GIT_TERMINAL_PROMPT=0
          unset GIT_ASKPASS SSH_ASKPASS
          export GIT_CONFIG_COUNT=3 \
                 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
                 GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf '%s:%s' "$GH_USER" "$GH_TOKEN" | base64 -w0)" \
                 GIT_CONFIG_KEY_1='credential.helper' \
                 GIT_CONFIG_VALUE_1='' \
                 GIT_CONFIG_KEY_2='core.askPass' \
                 GIT_CONFIG_VALUE_2=''
          refspecs=('+refs/tags/*:refs/tags/*')
          for b in $BRANCHES; do
            refspecs+=("+refs/remotes/origin/${b}:refs/heads/${b}")
          done
          # Backstop for anything that still blocks (egress drop, a git build that ignores
          # GIT_TERMINAL_PROMPT): a mirror push of this size is seconds, never minutes.
          set +e
          timeout 300 git push --force "https://github.com/${REPO}.git" "${refspecs[@]}"
          rc=$?
          set -e
          if [[ $rc == 124 ]]; then
            echo "ERROR: git push to github.com timed out after 5m — read this as an auth or egress failure, never as a slow push."
          fi
          exit "$rc"
      - name: Create GitHub release
        if: inputs.create-release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ inputs.repo }}
          # Per-job token; read-only use — fetches the Forgejo release body so notes
          # survive the workflow_dispatch backfill path (event.release.body is empty there).
          FORGEJO_API_TOKEN: ${{ github.token }}
        # REST API, not the gh CLI: the Forgejo ci-runner image does not ship gh, so the
        # step died with `gh: command not found` after the ref mirror had already
        # succeeded (ploeg run 181). Installing gh would mean one more github.com download
        # on the release path, which is exactly the dependency that keeps flaking (the
        # syft installer took the signing job out twice). curl and jq are already here.
        run: |
          set -euo pipefail

          gh_api() {
            curl -sS -H "Authorization: token ${GH_TOKEN}" \
                 -H 'Accept: application/vnd.github+json' \
                 -H 'X-GitHub-Api-Version: 2022-11-28' \
                 -H 'Content-Type: application/json' "$@"
          }

          # Idempotent: an existing release is left exactly as it is.
          code="$(gh_api -o /tmp/rel.json -w '%{http_code}' \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")"
          if [ "$code" = "200" ]; then
            echo "Release ${TAG} already exists on github.com/${REPO} — nothing to do."
            exit 0
          fi

          # What `gh release create --verify-tag` bought us: POST /releases will happily
          # CREATE the tag as a side effect, and a release pointing at a tag the mirror
          # never pushed would be a silent lie.
          tag_code="$(gh_api -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/${REPO}/git/ref/tags/${TAG}")"
          if [ "$tag_code" != "200" ]; then
            echo "ERROR: tag ${TAG} is not on github.com/${REPO} (HTTP ${tag_code})."
            echo "       The ref mirror has to land before a release can point at it."
            exit 1
          fi

          # Notes come from the Forgejo release so the workflow_dispatch backfill path
          # keeps them (github.event.release.body is empty there). Fail-soft: with no body
          # we ask GitHub to generate the notes instead.
          body="$(curl -sS -H "Authorization: token ${FORGEJO_API_TOKEN}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${REPO}/releases/tags/${TAG}" \
            | jq -r '.body // ""' 2>/dev/null || true)"

          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac

          if [ -n "$body" ]; then
            payload="$(jq -n --arg tag "$TAG" --arg body "$body" --argjson pre "$prerelease" \
              '{tag_name:$tag, name:$tag, body:$body, prerelease:$pre, draft:false}')"
          else
            payload="$(jq -n --arg tag "$TAG" --argjson pre "$prerelease" \
              '{tag_name:$tag, name:$tag, prerelease:$pre, draft:false, generate_release_notes:true}')"
          fi

          code="$(gh_api -o /tmp/created.json -w '%{http_code}' -X POST -d "$payload" \
            "https://api.github.com/repos/${REPO}/releases")"
          if [ "$code" != "201" ]; then
            echo "ERROR: creating release ${TAG} failed (HTTP ${code})."
            jq -r '.message // tostring' /tmp/created.json 2>/dev/null || cat /tmp/created.json
            exit 1
          fi
          echo "Created $(jq -r .html_url /tmp/created.json)"

  github-distribute-image:
    name: 'Distribute image (GHCR)'
    if: inputs.enabled && inputs.image-name != ''
    runs-on: docker
    steps:
      # Same preflight as the mirror job, ahead of the builder boot: an unusable token
      # reaches `docker login ghcr.io` as the opaque `denied: denied` (ploeg run 170),
      # which reads like a permissions problem on the package rather than a dead secret.
      - name: Verify GHCR credentials
        shell: bash
        env:
          GHCR_USER: ${{ secrets.GH_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GHCR_USER"  ]] || { echo "ERROR: GH_USERNAME secret is empty."; exit 1; }
          [[ -n "$GHCR_TOKEN" ]] || { echo "ERROR: GH_TOKEN secret is empty."; exit 1; }
          code="$(curl -sS -o /dev/null -D /tmp/gh-user.headers -w '%{http_code}' \
            -H "Authorization: token ${GHCR_TOKEN}" https://api.github.com/user)"
          if [[ "$code" != 200 ]]; then
            echo "ERROR: GH_TOKEN rejected by api.github.com (HTTP ${code})."
            echo "       The secret is invalid, expired or revoked — github.com refused the"
            echo "       credential itself, so no package permission can help."
            echo "       Fix: rotate the GH_TOKEN secret to a CLASSIC PAT owned by ${GHCR_USER},"
            echo "            scopes 'repo' + 'write:packages'."
            echo "            Fine-grained PATs cannot write GHCR at all."
            exit 1
          fi
          scopes="$(tr -d '\r' < /tmp/gh-user.headers | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: //p')"
          echo "token scopes: ${scopes:-<none — fine-grained PAT>}"
          case ",${scopes// /}," in
            *,write:packages,*) ;;
            *)
              echo "ERROR: GH_TOKEN authenticates, but carries no 'write:packages' scope."
              echo "       GHCR will refuse the push. Fine-grained PATs never carry it — the"
              echo "       token has to be a CLASSIC PAT with 'repo' + 'write:packages'."
              exit 1 ;;
          esac
      # setup-buildx guarantees the buildx CLI plugin for imagetools; no builder is used.
      - uses: docker/setup-buildx-action@v3
      - name: Copy image from source registry
        shell: bash
        env:
          # Env, not `${{ }}` shell interpolation: Harbor robot usernames contain `$`.
          SOURCE_REGISTRY: ${{ inputs.mirror-from-registry }}
          SOURCE_USER: ${{ secrets.SOURCE_REGISTRY_USER }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_REGISTRY_TOKEN }}
          GHCR_USER: ${{ secrets.GH_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: ${{ inputs.owner }}
          IMAGE: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.push-latest }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_TOKEN" | docker login "$SOURCE_REGISTRY" -u "$SOURCE_USER" --password-stdin
          if ! printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
            echo "ERROR: docker login ghcr.io failed as ${GHCR_USER}."
            echo "       GHCR answers 'denied: denied' when it rejects the token itself, and"
            echo "       'requested access to the resource is denied' when the password is empty."
            echo "       Fix: rotate GH_TOKEN to a CLASSIC PAT with 'repo' + 'write:packages'."
            exit 1
          fi
          src="${SOURCE_REGISTRY}/${OWNER}/${IMAGE}:${VERSION}"
          docker buildx imagetools create -t "ghcr.io/${OWNER}/${IMAGE}:${VERSION}" "$src"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker buildx imagetools create -t "ghcr.io/${OWNER}/${IMAGE}:latest" "$src"
          fi
          docker buildx imagetools inspect "ghcr.io/${OWNER}/${IMAGE}:${VERSION}"
