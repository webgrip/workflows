name: '[Call] Cloudflare Static Deploy'

# Deploys an assets-only Cloudflare Worker (a static site's dist/) with wrangler from
# the consumer's own checkout: preview uploads on feature refs, production deploy plus
# live-edge verification on the release ref. Artifact promotion (homelab ADR-0088) adds two
# more: 'staging' uploads a release as a Workers version tagged with its git tag and serves it
# on a preview alias, and 'promote' deploys that same version to production, so production runs
# the bytes staging ran. Extracted from twente.dev and webgrip.nl,
# whose deploy jobs were hand-synced copies of each other (twente.dev ADR-0003 named
# this extraction as its Phase 2).
#
# wrangler runs through `pnpm exec` (it is a devDependency of the consumer, installed
# by the install step), never `pnpm dlx`: dlx installs into a throwaway project that
# never sees the consumer's pnpm-workspace.yaml allowBuilds, so pnpm's build-scripts
# guard prompts interactively for esbuild/workerd and the job hangs forever. This is
# also why the workflow assumes pnpm rather than taking a package-manager input.
#
# Secrets scope note: CLOUDFLARE_API_TOKEN needs Account/Workers Scripts:Edit +
# Account/Account Settings:Read + Zone/Workers Routes:Edit. The zone scope is the one
# people forget: a token without it uploads the worker and then dies creating the
# route binding ("No targets deployed"), which presents as a green-looking deploy and
# a dead site.
#
# ADR-0005 deviation, declared: the toolchain is installed at job time (setup-node +
# corepack) instead of riding a baked Harbor image. This is a lift-and-shift of two
# proven consumer jobs; the follow-up is a static-site-ci-runner image built in
# webgrip/infrastructure, after which this gains a runner-image input.

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Which deploy this call performs: 'preview' (wrangler versions upload),
          'staging' (upload the release named by version-tag as a tagged version on the
          staging-alias preview alias, then verify it), 'promote' (deploy the version tagged
          version-tag to production, then verify the apex) or 'production' (build and
          wrangler deploy + edge verification, the pre-promotion path). Pass a LITERAL string:
          Forgejo v15 evaluates a caller's with-expressions at flatten time with an
          EMPTY github context, so ref-dependent expressions come out wrong there.
          Ref routing happens inside this workflow instead (production-refs).
        type: string
        required: true
      apex-url:
        description: "Public origin to verify after a production deploy, no trailing slash (e.g. 'https://twente.dev')"
        type: string
        required: true
      smoke-paths:
        description: 'Newline-separated paths that must answer 200 on the apex after a production deploy'
        type: string
        required: false
        default: ''
      not-found-path:
        description: >-
          A path that must answer 404 after a production deploy — proves
          wrangler.toml's not_found_handling actually serves the 404 page with a
          404 status instead of a soft-404. Empty = skip.
        type: string
        required: false
        default: ''
      production-refs:
        description: 'Space-separated full refs that deploy to production; every other ref is preview-only. Ignored when release-channel is set.'
        type: string
        required: false
        default: 'refs/heads/main'
      release-channel:
        description: >-
          Deploy from a Forgejo release event instead of a branch ref. Any non-empty value
          ('stable' or 'prerelease', for the run log) disables the production-refs gating and
          trusts the caller's `enabled`: the caller decides the channel in a plain job that reads
          github.event.release.tag_name on the runner and passes `enabled` from its needs outputs,
          because the flattened job's own if sees no release context. Empty keeps branch gating.
        type: string
        required: false
        default: ''
      version-tag:
        description: >-
          The release's git tag (e.g. v1.4.0). 'staging' checks it out, builds it and tags the
          uploaded Workers version with it; 'promote' deploys the version carrying it. Required for
          both.
        type: string
        required: false
        default: ''
      staging-alias:
        description: "Preview alias a 'staging' upload is served on: https://<alias>-<worker>.<subdomain>.workers.dev"
        type: string
        required: false
        default: 'staging'
      wrangler-env:
        description: "wrangler environment ([env.<name>] in wrangler.toml) passed as --env to the production job's deploy; empty deploys the top-level worker"
        type: string
        required: false
        default: ''
      edge-probe-path:
        description: 'Path polled until the edge answers edge-probe-expect after a production deploy'
        type: string
        required: false
        default: '/'
      edge-probe-expect:
        description: "HTTP status the edge probe must answer; '302' for a hostname behind Cloudflare Access, where anonymous requests are redirected to the login"
        type: string
        required: false
        default: '200'
      check-redirects:
        description: 'Verify every public/_redirects rule against the live edge; disable for a hostname behind Cloudflare Access'
        type: boolean
        required: false
        default: true
      node-version:
        description: 'Node.js version to install'
        type: string
        required: false
        default: '24'
      build-command:
        description: 'Build command run before deploying (its output directory is what wrangler.toml points at)'
        type: string
        required: false
        default: 'pnpm build'
      working-directory:
        description: 'Directory containing package.json, wrangler.toml and public/_redirects'
        type: string
        required: false
        default: '.'
      enabled:
        description: >-
          Gate the jobs from INSIDE the reusable. Forgejo v15 flattening drops
          if-conditions on uses-caller jobs, so a caller cannot skip this call with
          its own if; pass false (or rely on production-refs) instead.
        type: boolean
        required: false
        default: true
      api-base:
        description: 'Forgejo API base URL for the preview PR comment'
        type: string
        required: false
        default: 'https://forgejo.webgrip.dev/api/v1'
      comment-marker:
        description: 'Hidden marker keeping the preview PR comment idempotent (one comment per PR)'
        type: string
        required: false
        default: 'cloudflare-preview-marker'
      comment-body:
        description: 'Preview PR comment text; {url} is replaced with the preview URL. The marker is appended automatically.'
        type: string
        required: false
        default: '🔍 **Deploy preview**: {url} — rendered build of this branch. Updates on every push.'
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare token: Account/Workers Scripts:Edit + Account/Account Settings:Read + Zone/Workers Routes:Edit'
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare account id'
        required: true

jobs:
  cfpreview:
    name: 'Deploy preview'
    # Space-padding both sides makes the ref match whole-token (refs/heads/main must
    # not match refs/heads/maintenance). github.ref is trustworthy here: this is a
    # real job, evaluated on the runner, not at flatten time.
    if: >-
      inputs.enabled && inputs.environment == 'preview' &&
      !contains(format(' {0} ', inputs.production-refs), format(' {0} ', github.ref))
    runs-on: docker
    environment: preview
    permissions:
      contents: read
    steps:
      # Pinned to v5. The "v6 is broken on non-GitHub runners" reason was
      # disproven 2026-09-18 (homelab-cluster canary run 1710); the pin stays.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Upload preview version
        id: upload
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `versions upload` publishes a non-production version and prints a preview
          # URL. Reviewers see the rendered page, not the YAML diff — the single
          # highest-value CI feature for a content site.
          pnpm exec wrangler versions upload | tee upload.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -1 || true)"
          echo "preview-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Report preview URL
        if: steps.upload.outputs.preview-url != ''
        shell: bash
        run: |
          echo "Preview: ${{ steps.upload.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the PR (if one exists for this branch)
        if: steps.upload.outputs.preview-url != ''
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.comment-body }}
          COMMENT_MARKER: ${{ inputs.comment-marker }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
        run: |
          set -euo pipefail
          # Marker-idempotent poster (pattern from spa-preview.yml), rewritten from
          # python3 to node because this job installs node anyway and runs directly
          # on the runner, where python3 is not guaranteed. Commenting is best-effort
          # by contract: every curl is -fsS with `|| exit 0`, because a missing PR or
          # an API hiccup must not fail a deploy that already succeeded.
          api="${{ inputs.api-base }}/repos/${GITHUB_REPOSITORY}"
          curl -fsS -H "Authorization: token ${{ github.token }}" \
            "${api}/pulls?state=open&limit=50" -o /tmp/pulls.json || exit 0
          PR="$(node -e '
            const pulls = require("/tmp/pulls.json");
            const hit = pulls.find((p) => p.head && p.head.ref === process.argv[1]);
            if (hit) console.log(hit.number);
          ' "$GITHUB_REF_NAME")"
          [ -n "$PR" ] || { echo "no open PR for ${GITHUB_REF_NAME} — skipping comment"; exit 0; }
          # The marker prevents comment spam: only post once per PR.
          curl -fsS -H "Authorization: token ${{ github.token }}" \
            "${api}/issues/${PR}/comments" -o /tmp/comments.json || exit 0
          if grep -q "$COMMENT_MARKER" /tmp/comments.json; then
            echo "preview comment already present"
            exit 0
          fi
          node -e '
            const body = process.env.COMMENT_BODY.replace("{url}", process.env.PREVIEW_URL);
            const marker = process.env.COMMENT_MARKER;
            process.stdout.write(JSON.stringify({ body: `${body} <!-- ${marker} -->` }));
          ' > /tmp/preview-comment.json
          curl -fsS -X POST -H "Authorization: token ${{ github.token }}" \
            -H 'Content-Type: application/json' \
            -d @/tmp/preview-comment.json "${api}/issues/${PR}/comments" >/dev/null || exit 0
          echo "preview comment posted on PR #${PR}"

  cfprod:
    name: 'Deploy production'
    if: >-
      inputs.enabled && inputs.environment == 'production' &&
      (inputs.release-channel != '' ||
        contains(format(' {0} ', inputs.production-refs), format(' {0} ', github.ref)))
    runs-on: docker
    environment: production
    permissions:
      contents: read
    steps:
      # Pinned to v5. The "v6 is broken on non-GitHub runners" reason was
      # disproven 2026-09-18 (homelab-cluster canary run 1710); the pin stays.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Deploy
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ inputs.wrangler-env }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "${WRANGLER_ENV}"}

      - name: Verify the live edge
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/edge-verify@main
        with:
          origin: ${{ inputs.apex-url }}
          probe-path: ${{ inputs.edge-probe-path }}
          probe-expect: ${{ inputs.edge-probe-expect }}
          smoke-paths: ${{ inputs.smoke-paths }}
          not-found-path: ${{ inputs.not-found-path }}
          check-redirects: ${{ inputs.check-redirects }}
          working-directory: ${{ inputs.working-directory }}

  cfstaging:
    name: 'Stage the release'
    if: inputs.enabled && inputs.environment == 'staging'
    runs-on: docker
    environment: staging
    permissions:
      contents: read
    outputs:
      version-id: ${{ steps.upload.outputs.version-id }}
      staging-url: ${{ steps.upload.outputs.staging-url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.version-tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Upload the release as a tagged version
        id: upload
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ inputs.wrangler-env }}
          VERSION_TAG: ${{ inputs.version-tag }}
          STAGING_ALIAS: ${{ inputs.staging-alias }}
        run: |
          set -euo pipefail
          [ -n "${VERSION_TAG}" ] || { echo "::error::version-tag is required to stage a release"; exit 1; }
          pnpm exec wrangler versions upload ${WRANGLER_ENV:+--env "${WRANGLER_ENV}"} \
            --tag "${VERSION_TAG}" --message "release ${VERSION_TAG}" \
            --preview-alias "${STAGING_ALIAS}" | tee upload.log
          version_id="$(grep -oiE 'version id: *[0-9a-f-]{36}' upload.log | grep -oE '[0-9a-f-]{36}' | head -1 || true)"
          url="$(grep -oE "https://${STAGING_ALIAS}-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev" upload.log | head -1 || true)"
          [ -n "${url}" ] || { echo "::error::wrangler printed no ${STAGING_ALIAS} alias URL. Preview URLs must be enabled for this Worker."; exit 1; }
          echo "version-id=${version_id}" >> "$GITHUB_OUTPUT"
          echo "staging-url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "Staged ${VERSION_TAG} as Workers version ${version_id:-unknown}"
            echo "Staging: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staging
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/edge-verify@main
        with:
          origin: ${{ steps.upload.outputs.staging-url }}
          probe-path: ${{ inputs.edge-probe-path }}
          probe-expect: ${{ inputs.edge-probe-expect }}
          smoke-paths: ${{ inputs.smoke-paths }}
          not-found-path: ${{ inputs.not-found-path }}
          check-redirects: ${{ inputs.check-redirects }}
          working-directory: ${{ inputs.working-directory }}

  cfpromote:
    name: 'Promote to production'
    if: inputs.enabled && inputs.environment == 'promote'
    runs-on: docker
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.version-tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Deploy the staged version
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ inputs.wrangler-env }}
          VERSION_TAG: ${{ inputs.version-tag }}
        run: |
          set -euo pipefail
          [ -n "${VERSION_TAG}" ] || { echo "::error::version-tag is required to promote a release"; exit 1; }
          pnpm exec wrangler versions deploy ${WRANGLER_ENV:+--env "${WRANGLER_ENV}"} \
            --version-tag "${VERSION_TAG}@100%" --message "promote ${VERSION_TAG}" --yes
          echo "Promoted ${VERSION_TAG} to production" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the live edge
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/edge-verify@main
        with:
          origin: ${{ inputs.apex-url }}
          probe-path: ${{ inputs.edge-probe-path }}
          probe-expect: ${{ inputs.edge-probe-expect }}
          smoke-paths: ${{ inputs.smoke-paths }}
          not-found-path: ${{ inputs.not-found-path }}
          check-redirects: ${{ inputs.check-redirects }}
          working-directory: ${{ inputs.working-directory }}
