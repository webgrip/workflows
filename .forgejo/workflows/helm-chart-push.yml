name: '[Call] Push Helm Chart'

on:
  workflow_call:
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry username (e.g. Harbor robot account) with push access.'
        required: true
      REGISTRY_TOKEN:
        description: 'Registry password/token (e.g. Harbor robot token) with push access.'
        required: true
    inputs:
      registry:
        description: 'Target registry host, e.g. harbor.<domain> (Harbor) or the Forgejo registry host.'
        type: string
        required: true
      path:
        description: 'Path to the Helm chart you wish to validate'
        type: string
        required: true
      name:
        description: 'Name of the Helm chart'
        type: string
        required: true
      version:
        description: 'Version of the Helm chart'
        type: string
        required: true
      ref:
        description: 'Git ref to check out. Defaults to the version — pass the tag explicitly for repos whose tags are prefixed (e.g. chart-v1.2.3).'
        type: string
        required: false
      oci-path:
        description: 'OCI repository path under the registry. Defaults to <owner>/<repo>.'
        type: string
        required: false
      best-effort:
        description: 'Do not fail the caller when the push fails (e.g. best-effort mirrors). Lives here because caller jobs with `uses:` cannot set continue-on-error.'
        type: boolean
        required: false
        default: false
      enabled:
        description: 'Gate the job from INSIDE the reusable. Forgejo v15 flattening drops if-conditions on uses-caller jobs, so pass conditions (e.g. a non-empty release version) here instead.'
        type: boolean
        required: false
        default: true
      link-repo:
        description: 'ONLY when the registry is this Forgejo instance: repo name to link the pushed chart package to, so it shows on <owner>/<repo>/packages (Forgejo packages land owner-scoped and unlinked). REGISTRY_TOKEN doubles as the API token, so it must be the CI bot token (WEBGRIP_CI_TOKEN), not a Harbor robot. Empty (default) skips linking.'
        type: string
        required: false
        default: ''

jobs:
  helm-chart-push:
    name: 'Push Helm Chart'
    if: inputs.enabled
    runs-on: docker
    continue-on-error: ${{ inputs.best-effort }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.version }} # Make sure we are on the tagged versioned commit
      # helm is baked into the ci-runner host image; setup-helm remains as fallback for
      # runners without it.
      - name: Check for preinstalled helm
        id: helm-check
        shell: bash
        run: |
          if command -v helm >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/setup-helm@v4
        if: steps.helm-check.outputs.present != 'true'
      # validate again?
      - name: Registry login
        shell: bash
        env:
          # Pass creds via env, not `${{ }}` interpolation into the shell: Harbor robot usernames
          # are `robot$project+name` — the `$` gets expanded by bash inside a double-quoted arg and
          # mangles the username to 401. Env-var expansion is not recursive, so the value stays literal.
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
      - run: |
          export HELM_EXPERIMENTAL_OCI=1
      # Harbor tags are immutable, so re-publishing a version that is already there fails
      # the job outright instead of no-opping — ploeg run 183 died with HTTP 412,
      # "'charts/ploeg:0.2.0-rc.23' configured as immutable", on a backfill of a release
      # whose chart was already published. An already-published chart is the desired end
      # state, so probe and skip. Runs after the login because the probe needs the same
      # credentials. Fail-open: anything but a clean hit falls through and pushes, which
      # is the behaviour every first publish already has.
      - name: Probe the registry for this chart version
        id: chart-probe
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          OCI_PATH: ${{ inputs.oci-path || github.repository }}
          CHART_NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          if helm show chart "oci://${REGISTRY}/${OCI_PATH}/${CHART_NAME}" --version "${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${OCI_PATH}/${CHART_NAME}:${VERSION} is already published on ${REGISTRY} — skipping the push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${OCI_PATH}/${CHART_NAME}:${VERSION} not found on ${REGISTRY} — packaging and pushing."
          fi
      - name: Package and push the chart
        if: steps.chart-probe.outputs.exists != 'true'
        run: |
          helm package ${{ inputs.path }}
          helm push ./${{ inputs.name }}-${{ inputs.version }}.tgz oci://${{ inputs.registry }}/${{ inputs.oci-path || github.repository }}
      # Forgejo-only: an OCI-pushed chart lands in the CONTAINER registry (type
      # `container`, named after the chart) and is NOT shown on the repo's packages page
      # until linked. Idempotent: the versioned GET shows .repository when already linked.
      - name: Link chart package to repo
        if: inputs.link-repo != ''
        shell: bash
        env:
          API: ${{ github.server_url }}/api/v1
          OWNER: ${{ github.repository_owner || 'webgrip' }}
          PKG: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ inputs.link-repo }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if curl -fsS -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${API}/packages/${OWNER}/container/${PKG}/${VERSION}" \
              | grep -q "\"full_name\":\"${OWNER}/${REPO}\""; then
            echo "Chart package ${PKG} already linked to ${OWNER}/${REPO}."
          else
            curl -fsS -X POST -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${API}/packages/${OWNER}/container/${PKG}/-/link/${REPO}"
            echo "Linked chart package ${PKG} -> ${OWNER}/${REPO}."
          fi
