name: '[Call] Forgejo Distribute'

# Mirrors a release's container image and/or OCI Helm chart into the Forgejo package
# registry and LINKS the packages to their repo, so <forge>/<owner>/<repo>/packages is
# populated. Forgejo packages are owner-scoped and land UNLINKED — the link call is what
# makes them show on the repo page. Proven shape: webgrip/ploeg on_release_published
# (inline since v0.1.0-rc.9; extracted here unchanged).
#
# Identity: the webgrip-ci bot. Callers MUST pass WEBGRIP_CI_TOKEN as REGISTRY_TOKEN —
# secrets.FORGEJO_TOKEN is the built-in per-job token (FORGEJO_ is a reserved secret
# prefix, an org secret can never shadow it) and it CANNOT write org packages: it
# docker-logins fine, builds, then 401s on push (reqPackageAccess). The username comes
# from the org var WEBGRIP_CI_BOT_NAME (falls back to the literal bot name).
#
# Mirror mode: pass mirror-from-registry (plus SOURCE_REGISTRY_* secrets) to COPY the
# already-built image from another registry instead of rebuilding it. The copy uses
# `docker buildx imagetools create`, which clones the whole multi-arch manifest list by
# digest — both registries end up serving byte-identical images, and the ~minutes-long
# duplicate build collapses into a seconds-long registry-to-registry copy. (A plain
# docker pull/tag/push would flatten the manifest list to the runner's arch.) Callers
# should `needs:` the job that builds the source image.

on:
  workflow_call:
    secrets:
      REGISTRY_TOKEN:
        description: 'CI bot token with write:package — pass secrets.WEBGRIP_CI_TOKEN, NOT secrets.FORGEJO_TOKEN (that is the per-job token and cannot write org packages).'
        required: true
      SOURCE_REGISTRY_USER:
        description: 'Mirror mode only: pull user for mirror-from-registry (e.g. secrets.HARBOR_ROBOT_USER).'
        required: false
      SOURCE_REGISTRY_TOKEN:
        description: 'Mirror mode only: pull token for mirror-from-registry.'
        required: false
    inputs:
      enabled:
        description: 'Gate the jobs from INSIDE the reusable. Forgejo v15 flattening drops if-conditions on uses-caller jobs, so pass conditions (e.g. a non-empty release version) here instead.'
        type: boolean
        required: false
        default: true
      version:
        description: 'Bare semver of the release, e.g. 1.2.3 or 0.1.0-rc.4 (also the image tag and chart version).'
        type: string
        required: true
      ref:
        description: 'Git ref to check out for the chart job. Defaults to v<version>.'
        type: string
        required: false
      registry:
        description: 'Forgejo registry host.'
        type: string
        required: false
        default: 'forgejo.webgrip.dev'
      owner:
        description: 'Package owner (org). Hardcoded default because github.repository_owner is EMPTY on Forgejo workflow_dispatch.'
        type: string
        required: false
        default: 'webgrip'
      link-repo:
        description: 'Repository name to link the packages to (usually the calling repo). Empty skips linking.'
        type: string
        required: false
        default: ''
      image-name:
        description: 'Container image name (e.g. ploegd). Empty skips the image job.'
        type: string
        required: false
        default: ''
      mirror-from-registry:
        description: 'Copy the already-built image from this registry (e.g. harbor.webgrip.dev) instead of rebuilding it. Assumes the same <owner>/<image-name> path on both sides. Requires SOURCE_REGISTRY_USER/SOURCE_REGISTRY_TOKEN. Empty builds from source (the docker-* inputs).'
        type: string
        required: false
        default: ''
      docker-file:
        description: 'Dockerfile path from the context.'
        type: string
        required: false
        default: 'Dockerfile'
      docker-context:
        description: 'Docker build context.'
        type: string
        required: false
        default: '.'
      platforms:
        description: 'Target platforms, comma-separated.'
        type: string
        required: false
        default: 'linux/amd64'
      docker-build-args:
        description: 'Docker build args (newline-separated KEY=VALUE entries), passed through verbatim.'
        type: string
        required: false
        default: ''
      push-latest:
        description: 'Also move <image>:latest. Callers should pass false for prereleases.'
        type: boolean
        required: false
        default: false
      chart-path:
        description: 'Path to the Helm chart (e.g. ops/helm/mychart). Empty skips the chart job. Chart.yaml version must equal <version> at <ref> (semantic-release-helm3 lockstep).'
        type: string
        required: false
        default: ''
      chart-name:
        description: 'Chart name (the OCI package will carry this name).'
        type: string
        required: false
        default: ''

jobs:
  distribute-image:
    name: 'Distribute image (Forgejo)'
    if: inputs.enabled && inputs.image-name != ''
    runs-on: docker
    env:
      REGISTRY_USERNAME: ${{ vars.WEBGRIP_CI_BOT_NAME || 'webgrip-ci' }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Build and push
        if: inputs.mirror-from-registry == ''
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@main
        with:
          registry: ${{ inputs.registry }}
          docker-context: ${{ inputs.docker-context }}
          docker-file: ${{ inputs.docker-file }}
          platforms: ${{ inputs.platforms }}
          docker-build-args: |
            ${{ inputs.docker-build-args }}
          # The composite skips empty tag lines, so the conditional latest line is safe.
          docker-tags: |
            ${{ inputs.owner }}/${{ inputs.image-name }}:${{ inputs.version }}
            ${{ inputs.push-latest && format('{0}/{1}:latest', inputs.owner, inputs.image-name) || '' }}
      # ASSERT the buildx CLI plugin; do NOT run setup-buildx-action here.
      # This step only needs `imagetools` (a registry-side operation) and the
      # comment below used to say "no builder is used" — but setup-buildx-action
      # BUILDS one regardless: it starts a `buildx_buildkit_builder-<uuid>`
      # container (default image moby/buildkit:buildx-stable-1) on the shared
      # per-node dind daemon. Those containers live OUTSIDE kubepods cgroups, so
      # Kubernetes cannot see or bound their memory; one leaked here on
      # 2026-07-30, grew for 12 days and took fringe-workstation NotReady on
      # 2026-08-11 (homelab-cluster rfc-ci-isolation-talos). The ci-runner image
      # ships the plugin at /usr/local/lib/docker/cli-plugins/docker-buildx, so
      # asserting it is both sufficient and free.
      - name: Assert buildx CLI plugin (mirror mode)
        if: inputs.mirror-from-registry != ''
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version >/dev/null 2>&1 \
            || { echo "::error::docker buildx plugin missing. The ci-runner image is expected to ship it at /usr/local/lib/docker/cli-plugins/docker-buildx."; exit 1; }
      - name: Copy image from source registry (mirror mode)
        if: inputs.mirror-from-registry != ''
        shell: bash
        env:
          # Env, not `${{ }}` shell interpolation: Harbor robot usernames contain `$`.
          SOURCE_REGISTRY: ${{ inputs.mirror-from-registry }}
          SOURCE_USER: ${{ secrets.SOURCE_REGISTRY_USER }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_REGISTRY_TOKEN }}
          TARGET_REGISTRY: ${{ inputs.registry }}
          OWNER: ${{ inputs.owner }}
          IMAGE: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.push-latest }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_TOKEN" | docker login "$SOURCE_REGISTRY" -u "$SOURCE_USER" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | docker login "$TARGET_REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          src="${SOURCE_REGISTRY}/${OWNER}/${IMAGE}:${VERSION}"
          docker buildx imagetools create -t "${TARGET_REGISTRY}/${OWNER}/${IMAGE}:${VERSION}" "$src"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker buildx imagetools create -t "${TARGET_REGISTRY}/${OWNER}/${IMAGE}:latest" "$src"
          fi
          docker buildx imagetools inspect "${TARGET_REGISTRY}/${OWNER}/${IMAGE}:${VERSION}"
      - name: Link package to repo
        if: inputs.link-repo != ''
        shell: bash
        env:
          API: ${{ github.server_url }}/api/v1
          OWNER: ${{ inputs.owner }}
          PKG: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ inputs.link-repo }}
        run: |
          set -euo pipefail
          # Link is per package NAME and idempotency-guarded: the versioned GET shows
          # .repository when linked (400 on re-link means already linked — only two
          # invalid-argument paths exist: owner mismatch and already-linked).
          if curl -fsS -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${API}/packages/${OWNER}/container/${PKG}/${VERSION}" \
              | grep -q "\"full_name\":\"${OWNER}/${REPO}\""; then
            echo "Package ${PKG} already linked to ${OWNER}/${REPO}."
          else
            curl -fsS -X POST -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${API}/packages/${OWNER}/container/${PKG}/-/link/${REPO}"
            echo "Linked package ${PKG} -> ${OWNER}/${REPO}."
          fi

  publish-chart:
    name: 'Publish chart (Forgejo)'
    if: inputs.enabled && inputs.chart-path != ''
    runs-on: docker
    env:
      REGISTRY_USERNAME: ${{ vars.WEBGRIP_CI_BOT_NAME || 'webgrip-ci' }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}
      # helm is baked into the ci-runner host image; setup-helm remains as fallback for
      # runners without it. Absolute URL + pinned version: data.forgejo.org has an
      # incomplete mirror set, and 'latest' resolution rate-limits via api.github.com.
      - name: Check for preinstalled helm
        id: helm-check
        shell: bash
        run: |
          if command -v helm >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: https://github.com/azure/setup-helm@v4
        if: steps.helm-check.outputs.present != 'true'
        with:
          version: v3.18.4
      - name: Push chart (OCI)
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          OWNER: ${{ inputs.owner }}
          CHART_PATH: ${{ inputs.chart-path }}
          CHART_NAME: ${{ inputs.chart-name }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          helm package "$CHART_PATH"
          helm push "./${CHART_NAME}-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER}"
      - name: Link chart package to repo
        if: inputs.link-repo != ''
        shell: bash
        env:
          API: ${{ github.server_url }}/api/v1
          OWNER: ${{ inputs.owner }}
          PKG: ${{ inputs.chart-name }}
          REPO: ${{ inputs.link-repo }}
        run: |
          set -euo pipefail
          # An OCI-pushed chart lands in Forgejo's CONTAINER registry (type `container`,
          # named after the chart) — hence container/, not helm/, in these paths.
          if curl -fsS -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${API}/packages/${OWNER}/container/${PKG}/${VERSION}" \
              | grep -q "\"full_name\":\"${OWNER}/${REPO}\""; then
            echo "Chart package ${PKG} already linked to ${OWNER}/${REPO}."
          else
            curl -fsS -X POST -H "Authorization: token ${REGISTRY_TOKEN}" \
              "${API}/packages/${OWNER}/container/${PKG}/-/link/${REPO}"
            echo "Linked chart package ${PKG} -> ${OWNER}/${REPO}."
          fi
