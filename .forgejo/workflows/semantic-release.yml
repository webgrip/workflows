name: 'Semantic Release'

# Single release train for a whole repository: runs the semantic-release composite action.
# For per-package trains in a monorepo, use semantic-release-monorepo.yml instead.

on:
  workflow_call:
    inputs:
      release-type:
        description: 'The type of release'
        required: false
        type: string
      use-bot-to-commit:
        description: 'Whether to use the Forgejo CI bot to commit changes'
        required: false
        default: false
        type: boolean
      toolchain-image:
        description: >-
          The image the release runs in — node, git, yq, semantic-release 25 and
          @webgrip/semantic-release-config, all locked (ADR 0005). Built and released in
          webgrip/infrastructure (ops/docker/semantic-release), so the tag is that image's own
          release version and this default is bumped deliberately, by a PR here, when the toolchain
          moves. Override with an image built FROM it if your prepareCmd needs extra tooling
          (helm, php, docker CLI).
        required: false
        # renovate: datasource=docker depName=harbor.webgrip.dev/webgrip/semantic-release
        default: 'harbor.webgrip.dev/webgrip/semantic-release:0.3.2'
        type: string
      dry-run:
        description: 'Run semantic-release with --dry-run (no tags, releases, or commits)'
        required: false
        default: false
        type: boolean
      install-dependencies:
        description: >-
          Install the CONSUMER's npm dependencies (and run its build script) before releasing:
          "auto" (default) does it only when a lockfile / build script actually exists and never
          fails the release, "true" is the same but fatal on failure, "false" skips both. A repo
          that merely carries a package.json (Go, PHP, Rust) wants auto or false.
        required: false
        default: 'auto'
        type: string
      enabled:
        description: 'Gate the job from INSIDE the reusable. Forgejo v15 flattening drops if-conditions on uses-caller jobs, so pass needs-based conditions here (needs.* survives flattening; github.* does NOT — use only-refs for branch gating).'
        required: false
        default: true
        type: boolean
      only-refs:
        description: >-
          Space-separated full refs allowed to release (e.g. "refs/heads/main
          refs/heads/development"); empty = no ref restriction. This exists because Forgejo v15
          evaluates a caller's `with:` expressions at flatten time with an EMPTY github context, so
          `enabled: ${{ github.ref == ... }}` silently gates wrong on both branches. Job-level `if:`
          on this (real) job is evaluated on the runner, where github.ref is the caller run's true
          ref — so pass the refs as static data and let the gate compare here.
        required: false
        default: ''
        type: string
      skip-refs:
        description: >-
          Space-separated full refs that must NOT run (e.g. "refs/heads/main refs/heads/development");
          empty = no exclusion. The inverse of only-refs, for a dry-run validation job that should
          run on feature branches (the PR) but not on the release branches where the real release runs.
        required: false
        default: ''
        type: string
      align-to-remote-tip:
        description: >-
          Before running semantic-release on a branch push, move the checkout onto the remote branch
          tip. A push that lands after this run was queued leaves the detached checkout BEHIND
          origin — semantic-release then aborts with "The local branch is behind the remote one,
          therefore a new version won't be published" and cuts nothing, a silent no-op that does not
          self-heal because the commit that overtook it is a `[skip ci]` release commit. Default
          true; disable only if a repo deliberately releases a non-tip SHA.
        required: false
        default: true
        type: boolean
    secrets:
      CI_TOKEN:
        description: 'CI bot token — pass secrets.WEBGRIP_CI_TOKEN. Preferred over FORGEJO_TOKEN: a caller-mapped secret named FORGEJO_TOKEN risks resolving to the built-in per-job token of the same name (Ghost releases, no native release event, no org package writes).'
        required: false
      FORGEJO_TOKEN:
        description: 'Forgejo CI bot token used for checkout/push and releases'
        required: false
    outputs:
      version:
        description: 'Bare semver of the release cut this run (empty if none)'
        value: ${{ jobs.semrel.outputs.version }}
      tag:
        description: 'Full git tag of the release, e.g. v1.2.3 (empty if none; needed as the checkout ref for tag-pinned follow-up jobs like helm-chart-push)'
        value: ${{ jobs.semrel.outputs.tag }}

# Two runs releasing the same ref race for the tag: the loser either cuts a duplicate version or
# aborts "behind remote" and cuts nothing. Serialize them. Deliberately NOT cancel-in-progress —
# a release cancelled mid-flight can leave a pushed tag with no release attached to it.
concurrency:
  group: semantic-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # NB: job id deliberately unlikely to collide with caller job ids (release, semantic-release, ...):
  # Forgejo v15 flattens reusable jobs into the caller run and rejects id collisions as cycles.
  semrel:
    name: 'Semantic Release'
    # Space-padding both sides makes the ref match whole-token (refs/heads/main must not match
    # refs/heads/maintenance). github.ref is trustworthy here (runner-evaluated), unlike in the
    # caller's with: expressions (server flatten-time, empty github context).
    if: >-
      inputs.enabled
      && (inputs.only-refs == '' || contains(format(' {0} ', inputs.only-refs), format(' {0} ', github.ref)))
      && !contains(format(' {0} ', inputs.skip-refs), format(' {0} ', github.ref))
    runs-on: docker
    # The toolchain is the image, not an install (ADR 0005). Everything the release needs is baked
    # in, so the job does no dependency resolution at all.
    container:
      image: ${{ inputs.toolchain-image }}
    permissions:
      contents: write # For pushing commits/tags
      pull-requests: write # If referencing or updating PRs
      issues: write # Needed to comment on issues/PRs
      statuses: write # (Optional) If you need to set commit statuses
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
      tag: ${{ steps.semantic-release.outputs.tag }}
    steps:
      - id: semantic-release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@main
        with:
          release-type: ${{ inputs.release-type }}
          token: ${{ secrets.CI_TOKEN || secrets.FORGEJO_TOKEN }}
          dry-run: ${{ inputs.dry-run }}
          install-dependencies: ${{ inputs.install-dependencies }}
          align-to-remote-tip: ${{ inputs.align-to-remote-tip }}
