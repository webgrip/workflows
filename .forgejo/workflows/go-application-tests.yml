name: 'Go Tests'

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to install. Empty reads go-version-file.'
        required: false
        default: ''
        type: string
      go-version-file:
        description: 'File the Go version is read from when go-version is empty: go.mod (its toolchain line, else its go line) or .go-version'
        required: false
        default: 'go.mod'
        type: string

jobs:
  tests-run:
    name: 'Go test suite'
    runs-on: docker

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: true

      - name: Ensure Go module exists
        id: ensure-module
        shell: bash
        run: |
          if [ ! -f go.mod ]; then
            echo 'go.mod was not found.'
            exit 1
          fi

      - name: Download dependencies
        id: download-dependencies
        shell: bash
        run: |
          start=$(date +%s)
          go mod download
          end=$(date +%s)
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: test
        shell: bash
        run: |
          mkdir -p test-results
          start=$(date +%s)
          go test ./... -coverprofile=coverage.out | tee test-results/go-test-output.txt
          end=$(date +%s)
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Upload test results
        id: upload-results
        if: ${{ always() }}
        uses: forgejo/upload-artifact@v4
        with:
          name: go-test-results
          path: |
            coverage.out
            test-results
          if-no-files-found: ignore

      - name: Render summary
        if: ${{ always() }}
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/workflow-status-summary@v3.3.2
        with:
          title: 'Go Tests'
          subtitle: 'Test execution for Go modules'
          metadata: |
            [
              {"label":"Runner","value":"arc-runner-set"},
              {"label":"Go version","value":"${{ inputs.go-version || inputs.go-version-file }}"}
            ]
          checks: |
            [
              {"name":"Module presence","status":"${{ steps.ensure-module.outcome }}","duration":"-","details":"go.mod required"},
              {"name":"Download dependencies","status":"${{ steps.download-dependencies.outcome }}","duration":"${{ steps.download-dependencies.outputs.seconds }}s","details":"go mod download"},
              {"name":"Test execution","status":"${{ steps.test.outcome }}","duration":"${{ steps.test.outputs.seconds }}s","details":"go test ./... with coverage"},
              {"name":"Results upload","status":"${{ steps.upload-results.outcome }}","duration":"-","details":"artifact go-test-results"}
            ]
          artifacts: |
            ["go-test-results"]
