name: '[Call] DNSControl'

on:
  workflow_call:
    inputs:
      mode:
        description: "'preview' shows the corrections for the checked-out config; 'push' previews, refuses undeclared deletions and applies; 'drift' fails when the live zone differs from the config"
        type: string
        required: true
      working-directory:
        description: 'Directory holding dnsconfig.js and the creds file'
        type: string
        required: false
        default: 'ops/dns'
      creds-file:
        description: 'DNSControl creds file inside working-directory; its apitoken and accountid read $CLOUDFLARE_API_TOKEN and $CLOUDFLARE_ACCOUNT_ID'
        type: string
        required: false
        default: 'creds.json'
      dnscontrol-version:
        description: 'DNSControl release to install, checksum-verified against its checksums.txt'
        type: string
        required: false
        # renovate: datasource=github-releases depName=StackExchange/dnscontrol
        default: '5.0.3'
      push-refs:
        description: "Space-separated full refs on which mode 'push' may apply; any other ref only previews"
        type: string
        required: false
        default: 'refs/heads/main'
      delete-trailer:
        description: "Commit trailer that authorises a deletion, one '<trailer>: <fqdn>' line per record; a push that deletes without it is refused"
        type: string
        required: false
        default: 'DNS-Allow-Delete'
      enabled:
        description: 'Gate the job from inside the reusable; a caller passes its push switch here, e.g. vars.DNS_PUSH == ''on'''
        type: boolean
        required: false
        default: true
      openbao-role:
        description: "OpenBao role on auth/forgejo (ci-<repo>); when set the job reads its Cloudflare credentials over OIDC instead of the secrets, the caller job sets enable-openid-connect: true, and mode 'push' is refused"
        type: string
        required: false
        default: ''
      openbao-kv-path:
        description: "kv-v2 API path of the zone's read-only credential, with properties token and account_id, e.g. secret/data/cloudflare/dns/twente-dev-ro"
        type: string
        required: false
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare token with Zone:Read and DNS:Edit on the zones the config declares; required unless openbao-role is set'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare account id; required unless openbao-role is set'
        required: false

jobs:
  dnscontrol:
    name: 'DNS ${{ inputs.mode }}'
    if: >-
      inputs.enabled && (inputs.mode != 'push' ||
        contains(format(' {0} ', inputs.push-refs), format(' {0} ', github.ref)))
    runs-on: docker
    enable-openid-connect: true
    permissions:
      contents: read
    steps:
      - name: Refuse a push with a read-only credential
        if: inputs.openbao-role != '' && inputs.mode == 'push'
        shell: bash
        run: |
          echo "::error::refusing: mode 'push' cannot run on openbao-role. CI holds only the zone's read-only token; a push is applied by the in-cluster DNS reconciler (homelab-cluster ADR-0061). Use mode 'preview' or 'drift' here."
          exit 1

      - name: Cloudflare credentials from secrets
        if: inputs.openbao-role == ''
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN}" ] && [ -n "${ACCOUNT_ID}" ] || { echo "::error::pass the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, or set openbao-role and openbao-kv-path"; exit 1; }
          {
            echo "CLOUDFLARE_API_TOKEN=${TOKEN}"
            echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}"
          } >> "$GITHUB_ENV"

      - name: Require openbao-kv-path
        if: inputs.openbao-role != '' && inputs.openbao-kv-path == ''
        shell: bash
        run: |
          echo "::error::openbao-role is set but openbao-kv-path is empty; pass the zone's read path, e.g. secret/data/cloudflare/dns/twente-dev-ro"
          exit 1

      - name: Cloudflare credentials from OpenBao
        if: inputs.openbao-role != ''
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/openbao-read@main
        with:
          role: ${{ inputs.openbao-role }}
          secrets: |
            CLOUDFLARE_API_TOKEN=${{ inputs.openbao-kv-path }}#token
            CLOUDFLARE_ACCOUNT_ID=${{ inputs.openbao-kv-path }}#account_id

      - uses: actions/checkout@v5

      - name: Install dnscontrol
        shell: bash
        env:
          VERSION: ${{ inputs.dnscontrol-version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          base="https://github.com/StackExchange/dnscontrol/releases/download/v${VERSION}"
          archive="dnscontrol_${VERSION}_linux_${arch}.tar.gz"
          workdir="$(mktemp -d)"
          curl -fsSL "${base}/${archive}" -o "${workdir}/${archive}"
          curl -fsSL "${base}/checksums.txt" -o "${workdir}/checksums.txt"
          (cd "${workdir}" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${workdir}/${archive}" -C "${workdir}" dnscontrol
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${workdir}/dnscontrol" "${HOME}/.local/bin/dnscontrol"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/dnscontrol" version

      - name: Check
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: dnscontrol check

      - name: Preview
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          MODE: ${{ inputs.mode }}
          CREDS: ${{ inputs.creds-file }}
        run: |
          set -uo pipefail
          expect=""
          if [ "${MODE}" = "drift" ]; then
            expect="--expect-no-changes"
          fi
          set +e
          dnscontrol preview --creds "${CREDS}" ${expect} > preview.raw 2>&1
          rc=$?
          set -e
          sed 's/\x1b\[[0-9;]*m//g' preview.raw > preview.txt
          cat preview.txt
          { echo '```'; cat preview.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${rc}"

      - name: Refuse creating a zone
        if: inputs.mode == 'push'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          zones="$(sed -nE 's/^#[0-9]+: Ensuring zone "([^"]+)" exists.*/\1/p' preview.txt)"
          if [ -n "${zones}" ]; then
            for zone in ${zones}; do
              echo "refusing: the push would create zone ${zone}; the token cannot see it, or the zone does not exist in this account. Grant the token Zone:Read and DNS:Edit on ${zone}, or create the zone outside this lane."
            done
            exit 1
          fi

      - name: Refuse deletions without a trailer
        if: inputs.mode == 'push'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TRAILER: ${{ inputs.delete-trailer }}
        run: |
          set -euo pipefail
          deletes="$(sed -nE 's/^#[0-9]+: - DELETE ([^ ]+) .*/\1/p' preview.txt)"
          allowed="$(git log -1 --pretty=%B | sed -n "s/^${TRAILER}: *//p")"
          for name in ${deletes}; do
            echo "${allowed}" | grep -qxF "${name}" || { echo "refusing: the push deletes ${name} and HEAD carries no '${TRAILER}: ${name}' trailer"; exit 1; }
          done

      - name: Push
        if: inputs.mode == 'push'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CREDS: ${{ inputs.creds-file }}
        run: dnscontrol push --creds "${CREDS}"
