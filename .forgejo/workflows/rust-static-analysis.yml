name: 'Static Analysis'

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  static-analysis-run:
    name: 'Static Analysis (fmt, Clippy, Audit, Deny, Udeps, Outdated)'
    runs-on: docker

    container:
      image: harbor.webgrip.dev/webgrip/rust-ci-runner:1.4.1@sha256:315684ea932093a86ef2ca53765cba71ee1d06bf7f3ac7b47c85c276247b9c38

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: "cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}"

      # ---------- rustfmt ----------
      - name: rustfmt check
        run: cargo fmt --all -- --check

      # ---------- Clippy (like PHPStan/Psalm) ----------
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        if: always()

      # ---------- Security CVE scan ----------
      - name: cargo audit
        run: cargo audit
        if: always()

      # ---------- Policy / licence / advisories ----------
      - name: cargo deny
        run: cargo deny --all-features check --hide-inclusion-graph
        if: always()

      # ---------- Unused dependencies ----------
      - name: cargo udeps
        run: cargo +nightly udeps --all-targets
        if: always()

      # ---------- Outdated dependencies table ----------
      - name: cargo outdated
        run: cargo outdated --workspace --depth=1
        if: always()

      # ---------- Minimum-supported Rust version (nice-to-have) ----------
      - name: cargo msrv
        run: cargo msrv verify
        if: always()

      # ---------- Sort Cargo.toml files ----------
      - name: cargo sort
        run: cargo sort --workspace --check
        if: always()
