name: '[Call] Mirror Docker Images'

# Copy already-built images from one registry to another, e.g. Harbor (the deploy source)
# → the Forgejo registry so images appear as packages linked to their source repo (they
# carry org.opencontainers.image.source). The copy uses `docker buildx imagetools create`,
# which clones the whole multi-arch manifest list by digest — a docker pull/tag/push loop
# would silently flatten it to the runner's arch. best-effort lives HERE because caller
# jobs with `uses:` cannot set continue-on-error.

on:
  workflow_call:
    inputs:
      images:
        description: 'Newline-separated OWNER/IMAGE:TAG list (registry-relative, same path on both sides)'
        type: string
        required: true
      source-registry:
        description: 'Registry to pull from'
        type: string
        required: false
        default: 'harbor.webgrip.dev'
      target-registry:
        description: 'Registry to push to'
        type: string
        required: false
        default: 'forgejo.webgrip.dev'
      target-username:
        description: 'Login user for the target registry'
        type: string
        required: false
        default: 'webgrip-ci'
      best-effort:
        description: 'Do not fail the caller when the mirror fails (a registry hiccup must never fail a release)'
        type: boolean
        required: false
        default: true
      enabled:
        description: 'Gate the job from INSIDE the reusable. Forgejo v15 flattening drops if-conditions on uses-caller jobs, so pass conditions (e.g. a non-empty release version) here instead.'
        type: boolean
        required: false
        default: true

jobs:
  docker-mirror:
    name: 'Mirror images'
    if: inputs.enabled
    runs-on: docker
    continue-on-error: ${{ inputs.best-effort }}
    steps:
      # ASSERT the buildx CLI plugin; do NOT run setup-buildx-action here.
      # This job only needs `imagetools` (registry-side), but setup-buildx-action
      # starts a `buildx_buildkit_builder-<uuid>` container (default image
      # moby/buildkit:buildx-stable-1) on the shared per-node dind daemon for
      # nothing. Those containers sit OUTSIDE kubepods cgroups and are invisible
      # to kubelet accounting; one leaked from this class of step on 2026-07-30
      # and took a node NotReady 12 days later (homelab-cluster
      # rfc-ci-isolation-talos). The ci-runner image already ships the plugin.
      - name: Assert buildx CLI plugin
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version >/dev/null 2>&1 \
            || { echo "::error::docker buildx plugin missing. The ci-runner image is expected to ship it at /usr/local/lib/docker/cli-plugins/docker-buildx."; exit 1; }
      - name: Copy images
        shell: bash
        env:
          # Env, not `${{ }}` shell interpolation: Harbor robot usernames contain `$`.
          SOURCE_REGISTRY: ${{ inputs.source-registry }}
          TARGET_REGISTRY: ${{ inputs.target-registry }}
          SOURCE_USER: ${{ secrets.SOURCE_REGISTRY_USER }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_REGISTRY_TOKEN }}
          TARGET_USER: ${{ inputs.target-username }}
          TARGET_TOKEN: ${{ secrets.TARGET_REGISTRY_TOKEN }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_TOKEN" | docker login "$SOURCE_REGISTRY" -u "$SOURCE_USER" --password-stdin
          printf '%s' "$TARGET_TOKEN" | docker login "$TARGET_REGISTRY" -u "$TARGET_USER" --password-stdin
          while IFS= read -r img; do
            [ -n "$img" ] || continue
            docker buildx imagetools create -t "${TARGET_REGISTRY}/${img}" "${SOURCE_REGISTRY}/${img}"
            echo "mirrored ${img} ${SOURCE_REGISTRY} -> ${TARGET_REGISTRY}"
          done <<< "$IMAGES"
