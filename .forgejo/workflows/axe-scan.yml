name: '[Call] Axe Accessibility Gate'

# Runs the real axe-core rule set over the consumer's built pages. Lighthouse already
# asserts categories:accessibility, but that score is a sampling heuristic — it
# misses most ARIA and focus-order defects, which is why this gate exists alongside
# the budgets, not instead of them. Extracted from twente.dev and webgrip.nl, whose
# axe jobs were byte-similar hand-synced copies.
#
# Same sibling-docker rule as the Lighthouse gate: everything goes in by `docker cp`
# because bind mounts resolve on the HOST daemon, where the checkout does not exist.
#
# The image is the pinned static-site-ci-runner (webgrip/infrastructure). The one
# remaining runtime install is deliberate: @axe-core/playwright and playwright-core
# versions come from the CONSUMER's package.json so the gate can never drift from
# what a developer runs locally — baking them would break that contract.

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to install'
        type: string
        required: false
        default: '24'
      build-command:
        description: 'Build command producing dist/'
        type: string
        required: false
        default: 'pnpm build'
      working-directory:
        description: 'Directory containing package.json, lighthouserc.json and the scan script'
        type: string
        required: false
        default: '.'
      scan-script:
        description: 'Repo-relative TypeScript entrypoint that runs the scan (reads its page list from lighthouserc.json)'
        type: string
        required: false
        default: 'scripts/axe-scan.ts'
      extra-cp:
        description: 'Newline-separated extra repo paths to docker-cp into the container'
        type: string
        required: false
        default: ''
      browsers-image:
        description: 'Toolchain image the scan runs in (Chrome baked; built in webgrip/infrastructure)'
        type: string
        required: false
        # renovate: datasource=docker depName=harbor.webgrip.dev/webgrip/static-site-ci-runner
        default: 'harbor.webgrip.dev/webgrip/static-site-ci-runner:0.1.0'
      runtime-packages:
        description: 'Whitespace-separated npm package names the scan script imports; each is installed in the container at the version the consumer package.json declares, names the consumer does not declare are skipped'
        type: string
        required: false
        default: '@axe-core/playwright playwright-core @webgrip/astro-site-toolkit'
      enabled:
        description: 'Gate the job from INSIDE the reusable (Forgejo v15 flattening drops caller if-conditions on uses jobs)'
        type: boolean
        required: false
        default: true

jobs:
  axegate:
    name: 'Accessibility (axe-core)'
    if: inputs.enabled
    runs-on: docker
    permissions:
      contents: read
    steps:
      # Pinned to v5. The "v6 is broken on non-GitHub runners" reason was
      # disproven 2026-09-18 (homelab-cluster canary run 1710); the pin stays.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Run axe scan
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          EXTRA_CP: ${{ inputs.extra-cp }}
          IMAGE: ${{ inputs.browsers-image }}
          SCAN_SCRIPT: ${{ inputs.scan-script }}
          RUNTIME_PACKAGES: ${{ inputs.runtime-packages }}
        run: |
          set -euo pipefail
          PACKAGE_SPECS=$(node -p "
            const pkg = require('./package.json');
            const declared = { ...pkg.dependencies, ...pkg.devDependencies };
            process.env.RUNTIME_PACKAGES.split(/\\s+/).filter(Boolean)
              .filter((name) => declared[name])
              .map((name) => name + '@' + declared[name])
              .join(' ')
          ")
          echo "runtime packages: ${PACKAGE_SPECS}"

          # Run-id in the name: the runner's docker daemon is shared between repos.
          name="axe-${GITHUB_RUN_ID:-local}"
          docker rm -f "${name}" >/dev/null 2>&1 || true
          docker run -d --name "${name}" -w /repo "${IMAGE}" sleep 1800
          docker cp dist "${name}:/repo/dist"
          docker cp lighthouserc.json "${name}:/repo/lighthouserc.json"
          docker cp scripts "${name}:/repo/scripts"
          while IFS= read -r p; do
            [ -n "${p}" ] || continue
            docker cp "${p}" "${name}:/repo/${p}"
          done <<< "${EXTRA_CP}"
          # A MINIMAL package.json, not the repo's. The script is ESM so the
          # container needs "type": "module" to load a .ts entrypoint at all — but
          # copying the real one would make `npm i` resolve every devDependency
          # (astro, eslint, wrangler, …) before installing the two packages actually
          # wanted, which is minutes of nothing useful.
          docker exec -w /repo "${name}" bash -c 'echo "{\"type\":\"module\"}" > package.json'
          docker exec -w /repo "${name}" npm i --no-save --silent ${PACKAGE_SPECS}
          docker exec -w /repo "${name}" bash -c \
            "node --experimental-strip-types ${SCAN_SCRIPT}"

      - name: Clean up axe container
        if: always()
        shell: bash
        run: docker rm -f "axe-${GITHUB_RUN_ID:-local}" || true
